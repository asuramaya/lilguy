services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: internships
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lilguypassword}
      POSTGRES_DB: internships
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internships"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://internships:${POSTGRES_PASSWORD:-lilguypassword}@postgres:5432/internships
    command: ["python3", "service/migrate_sources_yaml.py"]
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  scheduler:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://internships:${POSTGRES_PASSWORD:-lilguypassword}@postgres:5432/internships
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    command: ["scheduler"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://internships:${POSTGRES_PASSWORD:-lilguypassword}@postgres:5432/internships
    command: ["api"]
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  edge-sync:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://internships:${POSTGRES_PASSWORD:-lilguypassword}@postgres:5432/internships
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    command: ["sync-once"]
    restart: "no"

volumes:
  pgdata:
