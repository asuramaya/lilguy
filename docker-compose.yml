services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: internships
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set -- is /srv/internships/.env present?}
      POSTGRES_DB: internships
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internships"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://internships:${POSTGRES_PASSWORD:?missing .env}@postgres:5432/internships
    command: python service/migrate_sources_yaml.py
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://internships:${POSTGRES_PASSWORD:?missing .env}@postgres:5432/internships
    command: python service/scheduler.py
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  discovery:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://internships:${POSTGRES_PASSWORD:?missing .env}@postgres:5432/internships
    command: python service/discovery.py
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Not a live service: this deployment's job is to scan (discovery +
  # scheduler) and hand the result to the edge (Cloudflare Pages), not to
  # serve HTTP traffic itself. Confirmed live (2026-09-06) that nothing
  # depends on api being continuously reachable -- edge_export.py reads
  # Postgres directly, and 72h of access logs showed nothing but a single
  # manual poke from the Docker bridge gateway (someone curling
  # 127.0.0.1:8000 on this box) plus verify_deploy.sh's own removed
  # health check. This block still exists ONLY because publish_edge.sh's
  # fallback path (`docker compose run --rm api python
  # service/edge_export.py`) reuses api's build/environment as a generic
  # one-off Python runner -- same reason migrate stays `restart: "no"`
  # rather than being deleted. `docker compose up` will start and
  # immediately exit this cleanly (like migrate); it never binds a port
  # or serves anything unless you explicitly `docker compose run --rm api
  # uvicorn service.api:app ...` by hand.
  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://internships:${POSTGRES_PASSWORD:?missing .env}@postgres:5432/internships
    command: python3 -c "print('api is on-demand only -- docker compose run --rm api <command>')"
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
