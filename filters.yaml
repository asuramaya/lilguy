#   - LA
#   - ME
#   - MD
#   - MA
#   - MI
#   - MN
#   - MS
#   - MO
#   - MT
#   - NE
#   - NV
#   - NH
#   - NJ
#   - NM
#   - NY
#   - NC
#   - ND
#   - OH
#   - OK
#   - OR
#   - PA
#   - RI
#   - SC
#   - SD
#   - TN
#   - TX
#   - UT
#   - VT
#   - VA
#   - WA
#   - WV
#   - WI
#   - WY
#   - DC
#   - United States # covers the minority of sources (confirmed: UPS's
#                   # jsonld postings) that do spell it out
#   - Remote

# Optional: drop postings whose location matches one of these, even if
# locations_include would otherwise let them through.
locations_exclude: []

# Optional: drop postings older than this many days, based on when THIS
# scraper first saw them (`first_seen`) — not each source's own
# `posted_at`, which isn't reliably comparable across sources (see
# user_filter.py's own comment on why). null = no age filtering.
max_age_days: null
