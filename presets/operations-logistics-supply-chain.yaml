# A copy of the root filters.yaml, kept here so it's discoverable
# alongside the other ready-made presets rather than being the one
# filter you have to already know exists. If you edit this project's
# default filter, keep this file in sync (or better: point build_feed.py
# straight at ../filters.yaml and treat this as a stable reference copy).

name: Supply Chain

keywords_any:
  - supply chain
  - logistics
  - logistic
  - procurement
  - sourcing
  - warehouse
  - distribution
  - inventory
  - fulfillment
  - manufacturing operations
  - transportation
  - freight

# Kept in sync with ../filters.yaml: excludes 3 companies' identical
# "About Us" boilerplate sentences that name-drop supply chain/
# transportation as one of many industries served, wrongly pulling in
# unrelated Software Engineering internships (confirmed live: cut a
# 43-posting overlap with the software-engineering preset down to 6).
exclude_keywords:
  - forecast supply chain disruptions
  - next mode of transportation
  - agriculture, construction, field services, transportation

trusted_companies:
  - Flexport
  - project44
  - FourKites
  - Uber Freight
  - Loadsmart
  - UPS
  - C.H. Robinson
  - Old Dominion Freight Line
  - J.B. Hunt

locations_include: []
locations_exclude: []
max_age_days: null
