<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #0d0d0c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
  }
  .glow {
    position: absolute;
    top: -220px;
    right: -180px;
    width: 640px;
    height: 640px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,149,42,0.16) 0%, rgba(232,149,42,0) 70%);
  }
  .mark {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 40px;
  }
  .bolt {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
  }
  .brand {
    font-size: 40px;
    font-weight: 700;
    color: #f0ede4;
    letter-spacing: -0.01em;
  }
  .brand .dim { color: #6d6858; font-weight: 500; }
  h1 {
    font-size: 60px;
    font-weight: 700;
    color: #f0ede4;
    line-height: 1.12;
    letter-spacing: -0.02em;
    max-width: 920px;
  }
  h1 .accent { color: #e8952a; }
  p.tag {
    margin-top: 26px;
    font-size: 25px;
    color: #a39d8c;
    max-width: 820px;
    line-height: 1.45;
  }
  .stats {
    margin-top: 44px;
    display: flex;
    gap: 48px;
  }
  .stat .n {
    font-size: 30px;
    font-weight: 700;
    color: #f0ede4;
  }
  .stat .n .accent { color: #e8952a; }
  .stat .l {
    margin-top: 4px;
    font-size: 16px;
    color: #6d6858;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="mark">
    <svg class="bolt" viewBox="0 0 24 24" fill="#e8952a"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    <div class="brand">lilguy<span class="dim">.win</span></div>
  </div>
  <h1>Every open internship,<br>in <span class="accent">one fast feed.</span></h1>
  <p class="tag">Search thousands of verified internship roles across hundreds of employers, filtered by cycle, workplace, function, and industry.</p>
  <div class="stats">
    <div class="stat"><div class="n"><span class="accent">8,300+</span></div><div class="l">Open Roles</div></div>
    <div class="stat"><div class="n"><span class="accent">1,000+</span></div><div class="l">Employers</div></div>
    <div class="stat"><div class="n"><span class="accent">Live</span></div><div class="l">Edge-Synced</div></div>
  </div>
</body>
</html>
