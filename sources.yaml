# Sources the scraper polls, in three tiers — see docs/sourcing-model.md
# for the reasoning behind the split.
#
# TIER 1 — AGGREGATORS: one entry, many companies, no per-company research
# at all. New employers show up automatically as the aggregator indexes
# them. The primary, general-purpose sourcing mechanism.
#
# TIER 1.5 — GENERIC JSON-LD HARVESTER (`ats: jsonld`): still one entry per
# company (needs that company's sitemap URL + a URL pattern), but the
# CONNECTOR CODE is generic — the same jsonld.py works on any career site
# that embeds schema.org/JobPosting data, regardless of which ATS vendor
# is underneath. This is what covers a company an aggregator missed
# without writing a new vendor-specific connector class for it.
#
# TIER 2 — VENDOR-SPECIFIC: one entry per company, AND the connector code
# itself is tied to that company's specific ATS vendor (Greenhouse/Lever/
# Workday). Highest precision, but the least general of the three —
# reach for Tier 1.5 first for a new company unless it happens to already
# use one of the three vendors these connectors cover.
#
# NOTE what's NOT here: any domain filtering (ops/logistics/supply-chain
# or otherwise). This file's only job is "what internship-shaped postings
# exist" — data/all_postings.json ends up with every one of them,
# regardless of industry. WHICH of those you actually want is a filters.yaml
# question (or your own copy of it), not a sources.yaml one — see
# docs/sourcing-model.md and filters.yaml's own comments.

sources:
  # ============================= TIER 1 =============================
  - company: The Muse (aggregator — every real category, queried separately)
    ats: muse
    level: Internship
    max_pages: 95
    # No API key needed. QUERIED PER CATEGORY rather than one blended
    # query — confirmed live these are NOT equivalent: "Healthcare" alone
    # has ~3500 internship-level postings, so a single blended query's
    # first ~1900 results (the API's own pagination depth limit — see
    # below) skewed overwhelmingly Healthcare, starving every other
    # category to whatever scraps were left (Transportation and
    # Logistics showed only 12 postings blended vs. its real total of 69
    # queried directly). Every category below except Healthcare has a
    # real total under the depth limit, so querying separately captures
    # each one's FULL total instead of an arbitrary blended slice.
    #
    # max_pages: 95 is a hard ceiling, not politeness — confirmed live
    # the API itself returns HTTP 400 for page >= ~96-99 of ANY query
    # regardless of total result count (page 95 -> 200, page 100 -> 400).
    # Only matters for Healthcare here (~3500 total, capped to ~1900);
    # every other category's real total is well under the limit and
    # returns in full regardless of this cap.
    #
    # This list was built by querying each candidate category directly
    # and keeping every one with total > 0 (checked ~35 candidates,
    # including several guesses that came back empty and were dropped —
    # e.g. "Food and Beverage Production"). Re-verify totals periodically;
    # The Muse's own taxonomy and what's indexed under it can drift.
    categories:
      - Healthcare
      - Software Engineering
      - Data and Analytics
      - Human Resources and Recruitment
      - Management
      - Business Operations
      - Science and Engineering
      - Advertising and Marketing
      - Education
      - Accounting and Finance
      - Transportation and Logistics
      - Sales
      - Project Management
      - Product Management
      - Unknown
      - Design and UX
      - Legal Services
      - Food and Hospitality Services
      - Account Management
      - Administration and Office
      - Computer and IT
      - Manufacturing and Warehouse
      - Media, PR, and Communications
      - Arts
      - Sports, Fitness, and Recreation
      - Writing and Editing
      - Entertainment and Travel Services
      - Personal Care and Services
      - Energy Generation and Mining
      - Cleaning and Facilities
      - Retail
      - Customer Service
      - Real Estate

  # Adzuna and USAJobs were removed in 2026-08: both connectors required
  # API keys, which this project's standing rule excludes, and both had
  # zero live sources -- they had never once run. Dead code that
  # silently no-ops on a missing env var is a trap: the next person to
  # add a source picks one, gets an empty result, and debugs their own
  # config instead of learning the connector was never viable here.

  # ============================ TIER 1.5 =============================
  - company: UPS
    ats: jsonld
    sitemap_url: https://www.jobs-ups.com/us/en/sitemap2.xml
    url_pattern: "/job/"
    category: Package Delivery
    max_pages: 80
    # Phenom-People-hosted career site — not Greenhouse/Lever/Workday/
    # Oracle, none of which this project's other connectors would have
    # caught. Confirmed live: individual job pages carry full
    # schema.org/JobPosting JSON-LD. sitemap2.xml (not sitemap1.xml,
    # which is category/landing pages only) is what actually lists
    # individual jobs — found by checking both, see docs/sourcing-model.md.

  - company: RTX
    ats: jsonld
    sitemap_url: https://careers.rtx.com/global/en/sitemap_index.xml
    url_pattern: "/job/"
    category: Aerospace & Defense
    max_pages: 150
    # A sitemap-INDEX (9 sub-sitemaps, ~4500 job URLs combined) — the
    # jsonld.py connector didn't originally expand these, treating the
    # index's own <loc> entries (more .xml files) as if they were job
    # pages; fixed to auto-expand one level of index nesting. Also the
    # source that surfaced a real WAF/bot-detection issue: firing
    # requests back-to-back with no pacing got intermittently 403'd —
    # fixed with a small delay between every request in jsonld.py
    # (REQUEST_DELAY_SECONDS), which is now applied to every jsonld
    # source, not just this one. Confirmed real per-job JobPosting
    # JSON-LD and at least one real intern posting visible in the
    # sitemap itself (a SkillBridge DoD internship in Huntsville, AL).

  - company: PepsiCo
    ats: jsonld
    sitemap_url: https://www.pepsicojobs.com/sitemap1.xml
    url_pattern: "/jobs/"
    category: Consumer Packaged Goods
    max_pages: 60
    # A different vendor again (not Phenom, not Greenhouse/Lever/Workday)
    # — confirmed live full JobPosting JSON-LD on a real posting, ~2900
    # job URLs in the sitemap. Note the job URL 302-redirects
    # (/jobs/<id> -> /main/jobs/<id>) before the JSON-LD shows up;
    # jsonld.py's plain requests.get() follows redirects by default, so
    # this needed no special handling, but it's why a page that looks
    # empty in a redirect-naive check (curl without -L) isn't necessarily
    # actually empty — always follow redirects before concluding a page
    # has no JSON-LD.

