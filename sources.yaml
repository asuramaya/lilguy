# Sources the scraper polls, in three tiers — see docs/sourcing-model.md
# for the reasoning behind the split.
#
# TIER 1 — AGGREGATORS: one entry, many companies, no per-company research
# at all. New employers show up automatically as the aggregator indexes
# them. The primary, general-purpose sourcing mechanism.
#
# TIER 1.5 — GENERIC JSON-LD HARVESTER (`ats: jsonld`): still one entry per
# company (needs that company's sitemap URL + a URL pattern), but the
# CONNECTOR CODE is generic — the same jsonld.py works on any career site
# that embeds schema.org/JobPosting data, regardless of which ATS vendor
# is underneath. This is what covers a company an aggregator missed
# without writing a new vendor-specific connector class for it.
#
# TIER 2 — VENDOR-SPECIFIC: one entry per company, AND the connector code
# itself is tied to that company's specific ATS vendor (Greenhouse/Lever/
# Workday). Highest precision, but the least general of the three —
# reach for Tier 1.5 first for a new company unless it happens to already
# use one of the three vendors these connectors cover.
#
# NOTE what's NOT here: any domain filtering (ops/logistics/supply-chain
# or otherwise). This file's only job is "what internship-shaped postings
# exist" — data/all_postings.json ends up with every one of them,
# regardless of industry. WHICH of those you actually want is a filters.yaml
# question (or your own copy of it), not a sources.yaml one — see
# docs/sourcing-model.md and filters.yaml's own comments.

sources:
  # ============================= TIER 1 =============================
  - company: The Muse (aggregator — all categories)
    ats: muse
    level: Internship
    max_pages: 95
    # No API key needed, no category restriction — pulls every
    # internship-level posting The Muse has indexed (~8000 as of when
    # this was written). max_pages is capped at 95, NOT for politeness —
    # confirmed live that the API itself starts returning HTTP 400 for
    # page >= ~96-99 regardless of total result count (tested: page 95
    # -> 200, page 100 -> 400). That's an undocumented depth limit on
    # their side, not a config error, so don't "fix" a future 400 here by
    # raising max_pages past ~95. Confirmed live: surfaces real postings
    # across companies never hand-added to this file (Walmart, Jabil,
    # Hitachi Energy...) — and now spans every industry The Muse covers,
    # not just ones this fork's own filters.yaml cares about, since that
    # narrowing happens downstream.

  # - company: Adzuna (aggregator — broad job search)
  #   ats: adzuna
  #   what: "intern OR internship"
  #   country: us
  #   # Needs YOUR OWN free key: https://developer.adzuna.com/ — set
  #   # ADZUNA_APP_ID / ADZUNA_APP_KEY as env vars (repo secrets in GitHub
  #   # Actions), never committed here. Uncomment once you have them —
  #   # left commented out because it's untested without credentials, not
  #   # because it doesn't work. `what` is intentionally broad here for
  #   # the same reason the Muse entry above dropped its category filter —
  #   # narrow with your own filters.yaml, not by narrowing the source.

  # ============================ TIER 1.5 =============================
  - company: UPS
    ats: jsonld
    sitemap_url: https://www.jobs-ups.com/us/en/sitemap2.xml
    url_pattern: "/job/"
    category: Logistics & Transportation
    max_pages: 80
    # Phenom-People-hosted career site — not Greenhouse/Lever/Workday/
    # Oracle, none of which this project's other connectors would have
    # caught. Confirmed live: individual job pages carry full
    # schema.org/JobPosting JSON-LD. sitemap2.xml (not sitemap1.xml,
    # which is category/landing pages only) is what actually lists
    # individual jobs — found by checking both, see docs/sourcing-model.md.

  - company: PepsiCo
    ats: jsonld
    sitemap_url: https://www.pepsicojobs.com/sitemap1.xml
    url_pattern: "/jobs/"
    category: CPG / Consumer Brands
    max_pages: 60
    # A different vendor again (not Phenom, not Greenhouse/Lever/Workday)
    # — confirmed live full JobPosting JSON-LD on a real posting, ~2900
    # job URLs in the sitemap. Note the job URL 302-redirects
    # (/jobs/<id> -> /main/jobs/<id>) before the JSON-LD shows up;
    # jsonld.py's plain requests.get() follows redirects by default, so
    # this needed no special handling, but it's why a page that looks
    # empty in a redirect-naive check (curl without -L) isn't necessarily
    # actually empty — always follow redirects before concluding a page
    # has no JSON-LD.

  # ============================= TIER 2 =============================
  # Verified working (Greenhouse):
  - company: Koch Industries
    ats: greenhouse
    token: koch
    category: Industrial Manufacturing

  - company: Flexport
    ats: greenhouse
    token: flexport
    category: Logistics & Transportation

  - company: project44
    ats: greenhouse
    token: project44
    category: Logistics & Transportation

  - company: FourKites
    ats: greenhouse
    token: fourkites
    category: Logistics & Transportation

  - company: Uber Freight
    ats: greenhouse
    token: uberfreight
    category: Logistics & Transportation

  - company: Samsara
    ats: greenhouse
    token: samsara
    category: Industrial Manufacturing

  # Verified working (Lever):
  - company: Loadsmart
    ats: lever
    token: loadsmart
    category: Logistics & Transportation

  # Verified working (Workday):
  - company: Unilever
    ats: workday
    tenant: unilever
    wd_host: wd3
    site: Unilever_Experienced_Professionals
    category: CPG / Consumer Brands
    # Found via WebSearch (curl-only sitemap hunting can't find Workday
    # sites — they're JS-rendered), then verified with a raw POST to the
    # jobs API. 309 total postings, real internships among them
    # ("Logistic Intern", "Revenue Management Intern", "Internship 26' -
    # Customer Development"...). NOTE: Unilever also runs a separate
    # Unilever_Early_Careers site on the same tenant/wd_host — tried it
    # first, only 1 posting live at the time this was checked (seasonal),
    # so Experienced_Professionals (which also lists internships) was
    # used instead for actual volume. This is the FIRST Workday entry in
    # this file and it caught a real connector bug: workday.py's own
    # `total` field is only accurate on page 1 of a query (every page
    # after reports total=0 despite still returning real results) —
    # fixed in scraper/connectors/workday.py, regression-tested in
    # tests/test_workday_connector.py. Any future Workday entry benefits
    # from that fix already being in place.

  # Checked for a Tier 1.5 (jsonld) fit and RULED OUT — documented so a
  # future session doesn't repeat the same search:
  #   - Caterpillar, GM, P&G, J&J, Nestle, Deere: their public sitemaps
  #     are marketing/landing pages only, no individual job URLs.
  #   - Walmart, Schneider National: same — category pages, not per-job.
  #   - J.B. Hunt: CORRECTED after re-checking — a prior version of this
  #     comment claimed its job pages use schema.org microdata. That was
  #     wrong: re-verified and the only microdata present is generic
  #     (BreadcrumbList, ImageObject), no JobPosting markup of any kind.
  #     It DOES have a real per-job sitemap
  #     (careers.jbhunt.com/jobs-sitemap.xml, 377 real job URLs), but the
  #     job pages themselves carry no structured data — likely rendered
  #     client-side with nothing server-side to parse, same class of
  #     problem as Honeywell/Caterpillar. No connector fits without a
  #     browser session to find the real underlying API.
  #   - Amazon: no sitemap advertised in robots.txt at all.
  #   - Honeywell: confirmed Oracle Recruiting Cloud, not Workday or
  #     anything sitemap-based — don't assume the ATS from a company's
  #     size or industry.
  #
  # Still worth trying Workday specifically for (their careers sites are
  # JS-rendered, so curl-only sitemap hunting doesn't find them — need a
  # browser session to read the real XHR calls, see docs/adding-a-source.md):
  # Cummins, PepsiCo's non-jsonld regions, Unilever, GE, 3M, Eaton, Parker
  # Hannifin, ITW, FedEx, Union Pacific/BNSF, Ford, Toyota, Boeing,
  # Lockheed Martin/RTX. Oracle Recruiting Cloud/SuccessFactors/iCIMS/Taleo
  # remain fully unsupported (no connector built) — see
  # docs/adding-a-source.md's "Unsupported ATS platforms" section.
