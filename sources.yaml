  - company: Koch Industries
    ats: greenhouse
    token: koch
    category: Industrial Manufacturing

  - company: Flexport
    ats: greenhouse
    token: flexport
    category: Logistics & Transportation

  - company: project44
    ats: greenhouse
    token: project44
    category: Logistics & Transportation

  - company: FourKites
    ats: greenhouse
    token: fourkites
    category: Logistics & Transportation

  - company: Uber Freight
    ats: greenhouse
    token: uberfreight
    category: Logistics & Transportation

  - company: Samsara
    ats: greenhouse
    token: samsara
    category: Industrial Manufacturing

  # Verified working (Lever):
  - company: Loadsmart
    ats: lever
    token: loadsmart
    category: Logistics & Transportation

  # Verified working (Workday):
  - company: Unilever
    ats: workday
    tenant: unilever
    wd_host: wd3
    site: Unilever_Experienced_Professionals
    category: CPG / Consumer Brands
    # Found via WebSearch (curl-only sitemap hunting can't find Workday
    # sites — they're JS-rendered), then verified with a raw POST to the
    # jobs API. 309 total postings, real internships among them
    # ("Logistic Intern", "Revenue Management Intern", "Internship 26' -
    # Customer Development"...). NOTE: Unilever also runs a separate
    # Unilever_Early_Careers site on the same tenant/wd_host — tried it
    # first, only 1 posting live at the time this was checked (seasonal),
    # so Experienced_Professionals (which also lists internships) was
    # used instead for actual volume. This is the FIRST Workday entry in
    # this file and it caught a real connector bug: workday.py's own
    # `total` field is only accurate on page 1 of a query (every page
    # after reports total=0 despite still returning real results) —
    # fixed in scraper/connectors/workday.py, regression-tested in
    # tests/test_workday_connector.py. Any future Workday entry benefits
    # from that fix already being in place.

  - company: GE Vernova
    ats: workday
    tenant: gevernova
    wd_host: wd5
    site: Vernova_ExternalSite
    category: Industrial Manufacturing
    max_pages: 120
    # Found via WebSearch, verified live: 2159 total postings. Unlike The
    # Muse, tested for a similar deep-pagination limit and found none
    # (offset 2140 still returns 200) — max_pages here is a generous
    # ceiling, not a discovered API constraint like the Muse entry's 95.

  - company: GE Aerospace
    ats: workday
    tenant: geaerospace
    wd_host: wd5
    site: GE_ExternalSite
    category: Industrial Manufacturing
    max_pages: 60
    # Same WebSearch-then-verify method. 440 total postings. Note: GE
    # split into GE Aerospace and GE Vernova as separate independent
    # companies in 2024 — companies.md's "General Electric (GE)" entry
    # now maps to these two Workday tenants, not one.

  - company: C.H. Robinson
    ats: workday
    tenant: chrobinson
    wd_host: wd5
    site: CHRobinson
    category: Logistics & Transportation
    max_pages: 30
    # Found via WebSearch. 94 total postings. A genuine 3PL/freight
    # broker — same category as Uber Freight/Flexport in the domain_native
    # sense, added to filters.yaml's trusted_companies for that reason.

  - company: Boeing (Internship Program)
    ats: workday
    tenant: boeing
    wd_host: wd1
    site: INTERN
    category: Aerospace & Defense
    max_pages: 30
    # Found via WebSearch — Boeing runs a SEPARATE Workday site
    # specifically for its internship program (as opposed to
    # EXTERNAL_CAREERS, the general one), found in a search result URL
    # almost by accident. 36 total postings, effectively 100% signal
    # (every posting here already is "Boeing Summer 2027 Internship
    # Program..."). Worth remembering as a pattern: some companies run a
    # DEDICATED early-careers/intern Workday site distinct from their
    # main one (Unilever does too — Unilever_Early_Careers vs.
    # Unilever_Experienced_Professionals) — check for both when adding a
    # new Workday company, the intern-specific one is often much higher
    # signal density even when its total volume is lower.

  - company: General Motors
    ats: workday
    tenant: generalmotors
    wd_host: wd5
    site: Careers_GM
    category: Automotive
    max_pages: 60
    # Found via WebSearch after curl-only sitemap hunting on GM's own
    # search-careers.gm.com came back empty (category/landing pages
    # only, documented below) — same story as Unilever: a JS-rendered
    # Workday site that sitemap-based discovery can't find on its own.
    # 845 total postings, real internships confirmed ("Customs Intern",
    # "Interior Design Intern", "Consumer Insight Intern").

  - company: Old Dominion Freight Line
    ats: workday
    tenant: odfl
    wd_host: wd1
    site: ODFL_Careers
    category: Logistics & Transportation
    max_pages: 15
    # Found via WebSearch. 236 total postings. An LTL freight carrier —
    # domain_native in the same sense as C.H. Robinson/Uber Freight,
    # added to filters.yaml's trusted_companies.

  - company: General Mills
    ats: workday
    tenant: genmills
    wd_host: wd1
    site: GMI_External_Careers
    category: CPG / Consumer Brands
    max_pages: 15
    # Found via WebSearch. 212 total postings. Diversified CPG, NOT
    # domain-native — relies on the standard keyword filter like PepsiCo/
    # Unilever/Walmart.

  - company: J.B. Hunt
    ats: workday
    tenant: jbhunt
    wd_host: wd501
    site: Careers
    category: Logistics & Transportation
    max_pages: 25
    # Found a genuinely different way than everything else here: J.B.
    # Hunt's OWN custom career site (careers.jbhunt.com) has its own
    # bespoke API (ww5.jbhunt.com/api/careers/jobs/, POST with an empty
    # JSON body) — not itself reusable by a connector since it's specific
    # to this one company's front-end, not a shared ATS platform. But its
    # own response data includes a jobPostingExternalUrl field pointing
    # at jbhunt.wd501.myworkdayjobs.com/Careers/... — meaning the REAL
    # backend, underneath J.B. Hunt's custom-branded front end, is
    # ordinary Workday. Used the standard workday.py connector directly
    # against that instead of writing a one-off connector for the
    # custom wrapper API. 384 total postings, real internships confirmed
    # ("Operations Internship, Fall 2026", "Intermodal Internship",
    # "Integrated Capacity Solutions Intern"). Domain-native (a
    # trucking/intermodal freight carrier) — added to filters.yaml's
    # trusted_companies. Lesson worth repeating: a company's own custom-
    # branded careers site can still be a thin wrapper over a real ATS
    # platform underneath — check the actual apply/job-detail URLs a
    # "custom" API returns before assuming a one-off connector is needed.

  # Checked and found EMPTY, not just hard to find — worth knowing so a
  # future session doesn't re-add these expecting results: FedEx's
  # Workday tenant is real (fedex.wd1.myworkdayjobs.com, found via
  # WebSearch) but both its FXE-US_External_Career_Site and
  # FXF_External_Career_Site sites return total=0 for an empty search —
  # not a config error (both return HTTP 200), the sites are just
  # currently empty or the wrong site name for what's actually posted.
  # Re-check periodically or find the actual populated site name.

  # Verified working (Oracle Recruiting Cloud — a 4th ATS platform, its
  # own connector as of this entry):
  - company: Honeywell
    ats: oracle_recruiting
    host: ibqbjb.fa.ocs.oraclecloud.com
    site_number: CX_1
    job_detail_base: https://careers.honeywell.com/en/sites/Honeywell/job
    category: Industrial Manufacturing
    max_pages: 55
    # Found via a live browser session (DevTools -> Network while
    # browsing careers.honeywell.com), not WebSearch — Oracle Recruiting
    # Cloud's host is an opaque per-company hash ("ibqbjb"), not a
    # guessable subdomain the way Workday tenants often are, so there's
    # no equivalent shortcut. 1313 total postings, confirmed real
    # internships ("Intern (Bachelor's)", "Electrical Engineer - Summer
    # 2026 Intern - Puerto Rico"). This is the connector this project
    # was missing for the LARGEST previously-uncovered platform — several
    # other big industrials/CPG companies likely run Oracle Recruiting
    # Cloud too (Caterpillar/Cummins/P&G were suspected but not
    # confirmed); each still needs its own host/site_number found the
    # same way, a browser session, not a shortcut.

  # Checked for a Tier 1.5 (jsonld) fit and RULED OUT — documented so a
  # future session doesn't repeat the same search:
  #   - Caterpillar, GM, P&G, J&J, Nestle, Deere: their public sitemaps
  #     are marketing/landing pages only, no individual job URLs.
  #   - Walmart, Schneider National: same — category pages, not per-job.
  #   - J.B. Hunt: ruled out for Tier 1.5/jsonld specifically (no
  #     JobPosting markup, JSON-LD or microdata, on its job pages —
  #     confirmed twice), but NOW COVERED via Workday, see the J.B. Hunt
  #     entry above — its custom front-end turned out to be a thin
  #     wrapper over an ordinary Workday backend.
  #   - Amazon: no sitemap advertised in robots.txt at all.
  #   - Honeywell: confirmed Oracle Recruiting Cloud, not Workday or
  #     anything sitemap-based — don't assume the ATS from a company's
  #     size or industry. NOW COVERED, see the oracle_recruiting entry
  #     above (this was only a sourcing dead-end for Tier 1.5/jsonld
  #     specifically, not for the project overall).
  #
  # DONE via Workday (found by WebSearch for a real myworkdayjobs.com
  # tenant, then verified with a raw POST — curl-only sitemap hunting
  # can't find these, they're JS-rendered): Unilever, GE Vernova, GE
  # Aerospace, General Motors, C.H. Robinson, Boeing (dedicated INTERN
  # site), Old Dominion Freight Line, General Mills.
  #
  # Checked via WebSearch and found NO usable myworkdayjobs.com tenant:
  # Cummins (only unrelated third-party childcare postings came up),
  # Costco (no Workday hit at all — likely a different ATS).
  #
  # Still untried (no WebSearch attempt yet, or attempted and the search
  # didn't surface a usable tenant): 3M, Eaton, Parker Hannifin, ITW,
  # Union Pacific/BNSF, Ford, Toyota, Lockheed Martin.
  #
  # ATS platform coverage as of this entry: Greenhouse, Lever, Workday,
  # Oracle Recruiting Cloud (oracle_recruiting.py — new, see the
  # Honeywell entry above), plus the generic jsonld.py (any vendor with a
  # job sitemap) and two aggregators (Muse, Adzuna). SuccessFactors and
  # iCIMS/Taleo remain fully unsupported (no connector built) — see
  # docs/adding-a-source.md's "Unsupported ATS platforms" section. Any
  # company suspected of running Oracle Recruiting Cloud (P&G, Caterpillar,
  # Cummins were guessed but never confirmed) needs its own host/
  # site_number found via a live browser session — WebSearch doesn't
  # surface these the way it does Workday tenants.
