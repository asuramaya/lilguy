# Sources the scraper polls, in three tiers — see docs/sourcing-model.md
# for the reasoning behind the split.
#
# TIER 1 — AGGREGATORS: one entry, many companies, no per-company research
# at all. New employers show up automatically as the aggregator indexes
# them. The primary, general-purpose sourcing mechanism.
#
# TIER 1.5 — GENERIC JSON-LD HARVESTER (`ats: jsonld`): still one entry per
# company (needs that company's sitemap URL + a URL pattern), but the
# CONNECTOR CODE is generic — the same jsonld.py works on any career site
# that embeds schema.org/JobPosting data, regardless of which ATS vendor
# is underneath. This is what covers a company an aggregator missed
# without writing a new vendor-specific connector class for it.
#
# TIER 2 — VENDOR-SPECIFIC: one entry per company, AND the connector code
# itself is tied to that company's specific ATS vendor (Greenhouse/Lever/
# Workday). Highest precision, but the least general of the three —
# reach for Tier 1.5 first for a new company unless it happens to already
# use one of the three vendors these connectors cover.
#
# domain_native: true skips the domain-keyword check in filters.py — for
# aggregator entries because the query/category already did that
# filtering (only set it if you've confirmed the category is actually
# narrow enough — see the Muse entry's own comment for a case where it
# wasn't); for a single-company entry because that company's whole
# business already is logistics/supply chain (e.g. "Uber Freight
# Internship 2026" never says "logistics" in the title). Leave it unset
# for a diversified company (industrials, CPG, retail) where the keyword
# filter is what keeps the feed relevant instead of every posting on the
# board.

sources:
  # ============================= TIER 1 =============================
  - company: The Muse (aggregator — Business Operations)
    ats: muse
    category: Business Operations
    category_label: Business Operations (aggregated)
    level: Internship
    # domain_native deliberately NOT set here, unlike a Tier 2 freight
    # broker: confirmed live that Muse's own "Business Operations" category
    # is broader than this project's scope (it pulled in hotel-admin and
    # account-management roles alongside real supply-chain/procurement
    # ones) — so the standard domain-keyword filter still applies on top
    # of it rather than trusting the category label as sufficient on its
    # own. No API key needed either way. Confirmed live: surfaces real
    # postings across companies never hand-added to this file (Walmart,
    # Jabil, Hitachi Energy...).

  # - company: Adzuna (aggregator — supply chain / logistics / ops intern)
  #   ats: adzuna
  #   what: "supply chain intern OR logistics intern OR operations intern OR procurement intern"
  #   category_label: Supply Chain / Logistics / Ops (aggregated)
  #   country: us
  #   domain_native: true
  #   # Needs YOUR OWN free key: https://developer.adzuna.com/ — set
  #   # ADZUNA_APP_ID / ADZUNA_APP_KEY as env vars (repo secrets in GitHub
  #   # Actions), never committed here. Uncomment once you have them —
  #   # left commented out because it's untested without credentials, not
  #   # because it doesn't work.

  # ============================ TIER 1.5 =============================
  - company: UPS
    ats: jsonld
    sitemap_url: https://www.jobs-ups.com/us/en/sitemap2.xml
    url_pattern: "/job/"
    category: Logistics & Transportation
    max_pages: 80
    domain_native: true
    # domain_native is correct here (unlike the Muse aggregator entry
    # above) for the same reason it's set on Uber Freight/Flexport in
    # Tier 2: UPS's whole business already IS logistics/transportation,
    # so an intern posting there shouldn't need the literal word
    # "logistics" in its text — confirmed live that without this flag,
    # the one real intern posting found ("Seasonal HR Intern") was
    # filtered out because its own text never says "logistics" or
    # "supply chain", despite the employer obviously being one.
    #
    # Phenom-People-hosted career site — not Greenhouse/Lever/Workday/
    # Oracle, none of which this project's other connectors would have
    # caught. Confirmed live: individual job pages carry full
    # schema.org/JobPosting JSON-LD. sitemap2.xml (not sitemap1.xml,
    # which is category/landing pages only) is what actually lists
    # individual jobs — found by checking both, see docs/sourcing-model.md.

  # ============================= TIER 2 =============================
  # Verified working (Greenhouse):
  - company: Koch Industries
    ats: greenhouse
    token: koch
    category: Industrial Manufacturing

  - company: Flexport
    ats: greenhouse
    token: flexport
    category: Logistics & Transportation
    domain_native: true

  - company: project44
    ats: greenhouse
    token: project44
    category: Logistics & Transportation
    domain_native: true

  - company: FourKites
    ats: greenhouse
    token: fourkites
    category: Logistics & Transportation
    domain_native: true

  - company: Uber Freight
    ats: greenhouse
    token: uberfreight
    category: Logistics & Transportation
    domain_native: true

  - company: Samsara
    ats: greenhouse
    token: samsara
    category: Industrial Manufacturing

  # Verified working (Lever):
  - company: Loadsmart
    ats: lever
    token: loadsmart
    category: Logistics & Transportation
    domain_native: true

  # Still need setup, Workday specifically (Oracle Recruiting Cloud/
  # SuccessFactors/iCIMS/Taleo companies should try Tier 1.5's jsonld
  # connector first — check for a job sitemap before assuming you need a
  # new vendor-specific connector class): Caterpillar, Cummins, Honeywell,
  # P&G, PepsiCo, GE, Unilever all still need either a Workday
  # tenant/site/wd_host (docs/adding-a-source.md) or a jsonld sitemap
  # entry (docs/sourcing-model.md) — not yet checked which. Confirmed
  # while building this: Honeywell runs Oracle Recruiting Cloud, not
  # Workday — don't assume the ATS from the company's size or industry.
  # Given Tier 1 + Tier 1.5 now exist, adding these one by one is
  # optional polish, not required for coverage.
