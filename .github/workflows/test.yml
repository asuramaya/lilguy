name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Only used by tests/service/ (skipped automatically if
      # DATABASE_URL isn't set) -- exercises the real SQL reconciliation
      # logic (upsert, close-on-absence, probation promotion) against a
      # real Postgres rather than a mock, since that's SQL correctness
      # under test, not connector correctness.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt -r service/requirements.txt

      - run: python -m py_compile scraper/*.py scraper/connectors/*.py service/*.py

      - run: python -m pytest tests/ -v
