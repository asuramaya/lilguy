name: Continuous Ingestion & Edge Deployment

on:
  schedule:
    # Run every 4 hours to keep feed fresh & prune closed roles
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g wrangler@4

      - name: Ingest fresh postings from connectors
        id: scrape
        run: python scraper/scrape.py
        continue-on-error: true

      - name: Run liveness audit & prune dead postings
        run: |
          python scripts/audit_liveness.py --limit 300 --workers 20 || true

      - name: Standardize and export edge distribution
        run: |
          python service/standardize.py
          python service/edge_export.py

      - name: Run E2E and syntax test suite
        run: |
          pytest tests/test_frontend_e2e.py -v

      - name: Commit updated dataset & metadata
        run: |
          git config user.name "lilguy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/all_postings.json FEED.md data/
          if git diff --cached --quiet; then
            echo "No change in tracked postings."
          else
            git commit -m "Auto-sync postings and prune expired listings [skip ci]"
            git push origin HEAD:master
            git push origin HEAD:main
          fi

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy dist --project-name lilguy --commit-dirty=true
