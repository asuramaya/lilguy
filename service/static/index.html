<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship Feed</title>
<link rel="alternate" type="application/atom+xml" title="Internship Feed" href="/feed.atom">
<style>
  :root {
    --canvas: #0d0d0c;
    --row: #161512;
    --row-hover: #1e1c17;
    --border: #2b2823;
    --border-strong: #3a362e;
    --ink: #f0ede4;
    --ink-secondary: #a39d8c;
    /* Was #6d6858, which measured 3.49:1 against --canvas -- under
       WCAG AA's 4.5:1 floor for normal text, and this token carries
       most of the metadata layer (locations, dates, counts, footer,
       placeholders, inactive tabs), so the failure was everywhere at
       once rather than in one corner. #8a8474 measures 5.22:1: passes
       with headroom while still reading as clearly dimmer than
       --ink-secondary (7.18:1), which is the whole point of the token. */
    --ink-tertiary: #8a8474;
    --accent: #e8952a;
    --accent-dim: #b87423;
    --ok: #4a9b6e;
    --warn: #c8933f;
    --bad: #c85a42;
    --focus: #e8952a;
    --measure: 1180px;
    --gutter: 28px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* One shared horizontal rhythm for header, main and footer. Before
     this, <header> was full-bleed while <main> was max-width:1180px
     centered, so on a wide screen the brand and tabs sat at x=28 while
     the toolbar and table started at x=595 -- a measured 567px
     misalignment that read as two unrelated pages stacked together. */
  .wrap {
    max-width: var(--measure);
    margin: 0 auto;
    padding: 0 var(--gutter);
    width: 100%;
  }

  /* Visible keyboard focus everywhere. The toolbar inputs previously set
     outline:none with no replacement, so a keyboard user typing into the
     search box had no indication of where focus was (WCAG 2.4.7). Inputs
     sit inside a styled .field wrapper, so the ring goes on the wrapper
     via :focus-within -- putting it on the bare input would draw it
     inside the visual control instead of around it. */
  :where(a, button, select, input, [tabindex]):focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 2px;
  }
  .field:focus-within {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-color: var(--border-strong);
  }

  header {
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--canvas);
    z-index: 20;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 20px 0 16px;
  }

  .brand h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }

  .status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-secondary);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-tertiary);
    box-shadow: 0 0 0 3px rgba(138, 132, 116, 0.15);
    flex-shrink: 0;
  }

  .status-dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(74, 155, 110, 0.15); }
  .status-dot.bad { background: var(--bad); box-shadow: 0 0 0 3px rgba(200, 90, 66, 0.15); }

  .events-wrap { position: relative; }

  .events-badge {
    /* Always laid out (never display:none), so .events-wrap never
       collapses to a zero-width flex item and drags the panel's
       position:absolute anchor point off to some other spot in the
       header -- confirmed live, that's exactly what display:none caused
       here: the panel rendered clipped off the viewport edge because its
       positioned ancestor had shrunk to nothing once the badge (its only
       in-flow content) was hidden. visibility keeps the same "invisible
       until there's something to show" behavior without destabilizing
       layout. */
    visibility: hidden;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    font-family: inherit;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  .events-badge.visible { visibility: visible; }
  .events-badge:hover { background: rgba(232, 149, 42, 0.08); }

  .events-panel {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 380px;
    max-width: calc(100vw - 48px);
    max-height: 420px;
    overflow-y: auto;
    background: var(--row);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 8px;
    z-index: 30;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  }
  .events-panel.open { display: block; }

  .events-panel .event-row {
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12.5px;
  }
  .events-panel .event-row + .event-row { border-top: 1px solid var(--border); }
  .events-panel .event-kind {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 3px;
  }
  .events-panel .event-kind::before { content: ""; width: 6px; height: 6px; border-radius: 1px; }
  .events-panel .event-kind.k-promoted, .events-panel .event-kind.k-reinstated { color: var(--ok); }
  .events-panel .event-kind.k-promoted::before, .events-panel .event-kind.k-reinstated::before { background: var(--ok); }
  .events-panel .event-kind.k-disabled { color: var(--bad); }
  .events-panel .event-kind.k-disabled::before { background: var(--bad); }
  /* A posting whose own URL now 404s. Neutral rather than red: nothing
     went wrong, a job was filled or withdrawn -- which is ordinary. */
  .events-panel .event-kind.k-expired { color: var(--ink-tertiary); }
  .events-panel .event-kind.k-expired::before { background: var(--ink-tertiary); }
  /* Loud, and deliberately louder than 'disabled'. A disabled source is
     one board gone; a stall means the WHOLE corpus is ageing and the
     dates on screen no longer mean what they appear to. */
  .events-panel .event-kind.k-stalled { color: var(--bad); font-weight: 700; }
  .events-panel .event-kind.k-stalled::before {
    background: var(--bad);
    box-shadow: 0 0 0 3px rgba(200, 90, 66, 0.18);
  }
  .events-panel .event-kind.k-backup_restore_test { color: var(--ink-secondary); }
  .events-panel .event-kind.k-backup_restore_test::before { background: var(--ink-tertiary); }
  .events-panel .event-detail { color: var(--ink-secondary); }
  .events-panel .event-time { color: var(--ink-tertiary); font-size: 11px; margin-top: 2px; }

  main { padding: 20px 0 60px; }

  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .toolbar .field {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--row);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 7px 10px;
  }

  .toolbar .field.grow { flex: 1; min-width: 200px; }

  .toolbar input, .toolbar select {
    background: none;
    border: none;
    color: var(--ink);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    width: 100%;
  }

  .toolbar input::placeholder { color: var(--ink-tertiary); }

  /* Native <select> popups don't inherit page CSS -- most browsers
     render the open option list with the OS's own (usually light) theme
     regardless of how the closed control is styled. Chromium and Firefox
     honor color/background-color set directly on <option>, which is the
     one lever that actually reaches the popup. Without it the closed
     select looks themed but the open list is near-illegible pale-on-white
     (confirmed live 2026-08-16); with it, ~15.6:1. */
  .toolbar select option {
    background: var(--row);
    color: var(--ink);
  }

  /* The category combobox needs room for the longest real labels
     ("Healthcare Marketing Communications"), but must not eat the whole
     toolbar on a narrow screen. */
  .toolbar .field:has(#feed-category), .toolbar .field:has(#feed-function) { min-width: 190px; }

  /* Neutral by default -- it usually reports COVERAGE, which is
     information rather than a problem. Only an unmatched typo is a
     warning, and that is what .is-warning is for. */
  .field-hint {
    color: var(--ink-tertiary);
    font-size: 11.5px;
    align-self: center;
    max-width: 34ch;
    line-height: 1.35;
  }
  .field-hint.is-warning { color: var(--bad); }

  /* A function tag is visually distinct from an industry tag so the two
     vocabularies stay tellable apart at a glance. Not colour alone --
     the border style carries it too, and the title attribute says which
     axis it is in words. */
  .swatch-tag.is-function { border-style: dashed; opacity: 0.88; }
  .field-hint:empty { display: none; }

  .toolbar .field-icon {
    color: var(--ink-tertiary);
    font-family: ui-monospace, monospace;
    font-size: 12px;
    flex-shrink: 0;
  }

  .result-line {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    color: var(--ink-tertiary);
    font-size: 12px;
    margin-bottom: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    flex-wrap: wrap;
    gap: 6px;
  }

  .result-line strong { color: var(--ink-secondary); font-weight: 500; }
  .result-line .truncated { color: var(--warn); }

  table {
    width: 100%;
    border-collapse: collapse;
    /* Fixed, with explicit <col> widths, because `auto` sized columns to
       their content: the longest location strings (up to 102 chars) won
       792px while Title -- the column you actually read -- was squeezed
       to 144px and wrapped to three lines. Measured live. Fixed layout
       also means the table always fits its container, so no horizontal
       scroll wrapper is needed, which is what let the sticky header
       start working (see thead note below). */
    table-layout: fixed;
  }

  thead th {
    /* Sticks to the sticky <header> above it. This was previously dead
       code: .table-wrap had overflow-x:auto, and per CSS spec setting
       one axis to auto computes the OTHER axis to auto too, making the
       wrapper a scroll container -- so `top: 0` anchored to a box that
       never scrolls vertically instead of to the page. Measured: after
       scrolling 1200px the header sat at top:-1004px, i.e. gone. With
       table-layout:fixed the overflow wrapper is unnecessary, so it's
       gone and sticky resolves against the viewport as intended. */
    position: sticky;
    /* Measured from the real sticky header at runtime rather than
       hardcoded -- the header's height changes with viewport width
       (.header-top wraps) and a stale constant would either float the
       column headers below the header or let rows slide under it. */
    top: var(--header-h, 92px);
    background: var(--canvas);
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-tertiary);
    padding: 0 12px 10px;
    border-bottom: 1px solid var(--border-strong);
    white-space: nowrap;
    z-index: 10;
  }

  thead th.num { text-align: right; }

  /* Sorting is a real <button>, not a click handler on a <th>. As a
     bare th it was mouse-only -- tabIndex -1, no role, unreachable by
     keyboard (WCAG 2.1.1) and silent to screen readers about both its
     interactivity and the current sort direction. */
  .sort-btn {
    font: inherit;
    color: inherit;
    text-transform: inherit;
    letter-spacing: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .sort-btn:hover { color: var(--ink-secondary); }
  th.num .sort-btn { flex-direction: row-reverse; }
  th[aria-sort] .sort-btn { color: var(--ink); }
  .sort-caret { color: var(--accent); }

  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:hover { background: var(--row-hover); }
  tbody td { padding: 11px 12px; vertical-align: top; }

  /* Single-line truncate, for cells where any overflow at all should
     just cut (the title column: this is the one thing on the row a
     reader is actually scanning, so it stays exactly one line tall
     regardless of what's in any other cell). Full value stays reachable
     via the title attribute (set in JS) and the link target. */
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Two-line clamp, for cells that should show a genuinely long value
     in full when reasonable ("Nexstar Media Group, Inc." fits on one
     wrapped line) but still can't be trusted to self-limit -- some ATS
     configs ship a location as an internal code dump, not a place
     ("CA-QC-LONGUEUIL-J01 ~ 1000 Blvd Marie-Victorin ~ J01 BLDG",
     confirmed live), and unbounded wrap let that one field set a
     6-line row height for postings sitting next to it that have a
     completely ordinary "Austin, TX". This is a LAYOUT decision, not a
     content one -- it doesn't try to parse or shorten what the source
     actually said, just refuses to let it consume the page.

     Goes on an inner wrapper, NEVER the <td> itself -- confirmed live,
     -webkit-line-clamp requires display:-webkit-box, and setting that
     directly on a table cell overrides its display:table-cell. The
     cell stops participating in table layout at all: every cell in the
     row becomes its own full-width block stacked vertically instead of
     sitting in its column, which is where the huge dead space between
     Title/Company/Location and the "sorted by date poste[d]" overflow
     off the right edge both came from -- not two bugs, one cause. */
  .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .title-cell a { color: var(--ink); text-decoration: none; font-weight: 500; }
  .title-cell a:hover { color: var(--accent); text-decoration: underline; }

  .company-cell { color: var(--ink-secondary); text-align: center; }
  .location-cell { color: var(--ink-tertiary); font-size: 12.5px; text-align: center; }

  .swatch-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    font-size: 11.5px;
    font-family: inherit;
    color: var(--ink-secondary);
    padding: 3px 8px 3px 6px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: 3px;
    white-space: nowrap;
    overflow: hidden;
    cursor: pointer;
  }
  .swatch-tag:hover { border-color: var(--accent-dim); color: var(--ink); }
  .swatch-tag::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 1px;
    background: var(--swatch-color, var(--accent-dim));
    flex-shrink: 0;
  }
  .swatch-label { overflow: hidden; text-overflow: ellipsis; }

  .status-cell {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    white-space: nowrap;
  }
  .status-cell::before { content: ""; width: 6px; height: 6px; border-radius: 1px; flex-shrink: 0; }
  .status-active::before, .status-promoted::before, .status-open::before { background: var(--ok); }
  .status-active, .status-promoted, .status-open { color: var(--ok); }
  .status-probation::before, .status-unchecked::before { background: var(--warn); }
  .status-probation, .status-unchecked { color: var(--warn); }
  .status-disabled::before, .status-rejected::before { background: var(--bad); }
  .status-disabled, .status-rejected { color: var(--bad); }
  .status-no_match::before { background: var(--ink-tertiary); }
  .status-no_match { color: var(--ink-tertiary); }

  .age-cell { color: var(--ink-secondary); font-size: 12px; text-align: right; white-space: nowrap; }
  /* Found is deliberately dimmer than Posted: both are shown so they can
     never be confused, but only one of them tells you whether a job is
     worth applying to. */
  .found-cell { color: var(--ink-tertiary); }
  .unknown-date { color: var(--ink-tertiary); font-style: italic; }
  /* A bounded age is not a measured one. Dotted underline rather than
     colour alone, so it survives a colourblind reader and a monochrome
     print; the "+" and the aria-label carry it for a screen reader. */
  .approx-date { border-bottom: 1px dotted var(--ink-tertiary); }

  /* Marks where confirmed cycle matches end and unconfirmed ones begin. */
  .group-divider td {
    background: var(--row);
    color: var(--ink-tertiary);
    font-size: 12px;
    padding: 7px 10px;
    border-top: 2px solid var(--border-strong);
    border-bottom: 1px solid var(--border);
  }
  .num-cell { text-align: right; }

  .empty { color: var(--ink-tertiary); padding: 48px 0; text-align: center; font-size: 13px; }

  .legend {
    color: var(--ink-tertiary);
    font-size: 12px;
    margin-bottom: 10px;
    line-height: 1.6;
  }
  .legend b { color: var(--ink-secondary); font-weight: 500; }


  /* --- entity pages ------------------------------------------------ */
  .detail { padding-top: 4px; }
  .crumb {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: none; padding: 4px 0; margin-bottom: 14px;
    color: var(--ink-tertiary); font-family: inherit; font-size: 12.5px; cursor: pointer;
  }
  .crumb:hover { color: var(--accent); }
  .detail h2 { margin: 0 0 4px; font-size: 21px; font-weight: 650; letter-spacing: -0.01em; }
  .detail .sub { color: var(--ink-secondary); font-size: 13px; margin-bottom: 18px; }
  .detail .sub a { color: var(--ink-secondary); }

  .kv { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-bottom: 20px; }
  .kv div { display: flex; flex-direction: column; gap: 2px; }
  .kv dt, .kv .k {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-tertiary);
  }
  .kv dd, .kv .v { margin: 0; font-size: 13px; color: var(--ink); }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 14px; border-radius: 5px; font-size: 13px; font-family: inherit;
    text-decoration: none; cursor: pointer; border: 1px solid var(--border-strong);
    background: var(--row); color: var(--ink);
  }
  .btn:hover { border-color: var(--accent-dim); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1206; font-weight: 600; }
  .btn.primary:hover { background: #f0a03d; color: #1a1206; }

  .section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-tertiary); margin: 26px 0 10px;
    border-bottom: 1px solid var(--border); padding-bottom: 6px;
  }

  /* Job descriptions are stored as plain text with real line breaks (see
     to_display_text) precisely so they can be rendered without a
     sanitizer -- pre-wrap honours that structure without markup. */
  .description {
    white-space: pre-wrap;
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--ink-secondary);
    max-width: 68ch;
  }
  .description-missing { color: var(--ink-tertiary); font-style: italic; font-size: 13px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--row); font-size: 12.5px; color: var(--ink-secondary);
    text-decoration: none; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent-dim); color: var(--accent); }
  .chip .n { color: var(--ink-tertiary); font-family: ui-monospace, monospace; font-size: 11.5px; }

  /* Not `a.entity`: a location cell (see locationHtml()) renders this
     same look on a <button> now that clicking one filters in place
     instead of opening an external Maps tab, and a bare-element
     selector still has to reset the browser's own button chrome
     (background/border/font/padding) that an <a> never had to begin
     with. */
  .entity { color: inherit; text-decoration: none; cursor: pointer; background: none; border: none; border-bottom: 1px solid transparent; font: inherit; padding: 0; }
  .entity:hover { color: var(--accent); border-bottom-color: var(--accent-dim); }

  .mini-list { display: flex; flex-direction: column; gap: 2px; }
  .mini-row {
    display: flex; justify-content: space-between; gap: 14px; align-items: baseline;
    padding: 8px 10px; border-radius: 4px; text-decoration: none; color: var(--ink);
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .mini-row:hover { background: var(--row-hover); }
  .mini-row .meta { color: var(--ink-tertiary); font-size: 12px; white-space: nowrap; }

  /* The board a company's postings arrive through, with its own health.
     Wraps rather than nowraps: unlike a mini-row's short date, this meta
     line carries a failure message of unpredictable length. */
  .board-card {
    padding: 9px 11px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--row); margin-bottom: 6px;
  }
  .board-card .board-name { font-weight: 600; text-decoration: none; color: var(--ink); }
  .board-card .board-name:hover { text-decoration: underline; }
  .board-card .meta {
    display: block; margin-top: 3px; color: var(--ink-tertiary);
    font-size: 12px; line-height: 1.5;
  }
  .bad { color: var(--bad); }

  .banner {
    padding: 10px 12px; border-radius: 5px; font-size: 12.5px;
    border: 1px solid var(--border-strong); background: var(--row);
    color: var(--ink-secondary); margin-bottom: 18px;
  }
  .banner b { color: var(--ink); font-weight: 600; }


  /* --- search bar + filters aside ----------------------------------
     Docked filter panel, not a popover: on desktop it's a true flex
     SIBLING of the results column (a real `<aside>` in the same flex
     row), so the browser reflows the table around it for free instead
     of it floating on top and covering rows. On a narrow viewport there
     is no room for a side-by-side panel, so the same element becomes a
     fixed bottom sheet instead -- one element, two position strategies,
     picked by a single media query rather than two markup branches. */

  .feed-layout { display: flex; align-items: flex-start; gap: 20px; }
  .feed-main { min-width: 0; flex: 1; }

  .search-embedded { position: relative; }
  .search-embedded input {
    width: 100%; box-sizing: border-box;
    background: var(--row); border: 1px solid var(--border); color: var(--ink);
    border-radius: 4px; padding: 9px 40px; font-size: 14px; font-family: inherit;
  }
  .search-embedded input::placeholder { color: var(--ink-tertiary); }
  .search-embedded-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--ink-tertiary); font-size: 14px; pointer-events: none;
  }
  /* The filter TOGGLE lives inside the search field's own trailing edge
     rather than as a separate button beside it -- one control reads as
     the toolbar, not a search box plus a second widget competing for
     attention next to it. */
  .search-embedded-filter-btn {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 4px;
    background: none; border: none; color: var(--ink-tertiary); cursor: pointer;
    font-size: 13px;
  }
  .search-embedded-filter-btn:hover { color: var(--ink); background: var(--row-hover); }
  .search-embedded-filter-btn[aria-expanded="true"] { color: var(--accent); }

  /* display:none by default, an explicit .visible class to turn it back
     on -- NOT the [hidden] attribute. [hidden] and a class selector tie
     on specificity, so a later `display` rule on this same class would
     silently outrank [hidden] and the badge would show "0" forever
     (measured live on the popover version of this control -- same
     failure shape as .events-badge above; same fix). */
  .filters-badge {
    display: none; align-items: center; justify-content: center;
    position: absolute; top: 1px; right: 1px;
    min-width: 14px; height: 14px; padding: 0 3px; border-radius: 999px;
    background: var(--accent); color: #14120d; font-size: 9.5px; font-weight: 700;
  }
  .filters-badge.visible { display: inline-flex; }

  .filters-aside {
    display: none; flex-direction: column;
    width: 300px; flex-shrink: 0;
    background: var(--row); border: 1px solid var(--border-strong); border-radius: 6px;
    overflow: hidden;
  }
  /* Desktop: sticky in-flow, not fixed -- flexbox reflows .feed-main
     around it for free the moment it opens, no manual width math on the
     table side. A fixed height (not max-height) that fills the viewport
     minus the sticky header, regardless of how few sections are
     expanded -- a panel that shrinks to whatever's open would read as
     an accident of content rather than a deliberately sized console;
     its OWN body scrolls internally for a genuinely tall expansion. */
  .filters-aside.open {
    display: flex;
    position: sticky; top: calc(var(--header-h, 92px) + 16px);
    height: calc(100vh - var(--header-h, 92px) - 32px);
  }

  .filters-aside-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .filters-aside-header .title { font-size: 13px; font-weight: 650; }
  .filters-aside-actions { display: flex; align-items: center; gap: 12px; }

  .icon-btn {
    background: none; border: none; color: var(--ink-tertiary); cursor: pointer;
    font-size: 14px; line-height: 1; padding: 2px;
  }
  .icon-btn:hover { color: var(--ink); }

  .btn-link {
    background: none; border: none; color: var(--ink-tertiary); font-size: 12px;
    font-family: inherit; cursor: pointer; padding: 0; text-decoration: underline;
  }
  .btn-link:hover { color: var(--ink); }

  .filters-aside-body { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .filters-aside-footer { padding: 10px 14px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .filters-aside-footer .btn { width: 100%; }

  /* Every field in the panel goes through this one collapsible wrapper,
     so "collapse all" and per-section memory work uniformly instead of
     each field owning its own header markup. */
  .filter-section { border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 2px; }
  .filter-section:last-child { border-bottom: none; }
  .filter-section-toggle {
    display: flex; width: 100%; align-items: center; justify-content: space-between;
    background: none; border: none; color: var(--ink-tertiary); font-family: inherit;
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em;
    cursor: pointer; padding: 8px 0 6px;
  }
  .filter-section-toggle:hover { color: var(--ink); }
  .filter-section-chevron { transition: transform 0.15s; color: var(--ink-tertiary); }
  .filter-section.collapsed .filter-section-chevron { transform: rotate(-90deg); }
  .filter-section-body { display: flex; flex-direction: column; gap: 6px; }
  .filter-section.collapsed .filter-section-body { display: none; }
  /* .field's dark styling used to come ENTIRELY from a `.toolbar .field`
     ancestor selector -- fine while every .field lived in a .toolbar,
     but this panel uses the same class outside one, so its inputs and
     selects fell back to the browser's default white-on-black-text
     controls (confirmed live: a glaring white box in an otherwise dark
     panel). Scoped to .filters-aside rather than promoted to a bare
     `.field` rule, so it can't silently double up with .toolbar .field
     if a toolbar field is ever nested inside the panel later. */
  .filters-aside .field {
    display: flex; align-items: center; gap: 8px;
    background: var(--canvas); border: 1px solid var(--border); border-radius: 4px; padding: 7px 10px;
    width: 100%;
  }
  .filters-aside .field input, .filters-aside .field select {
    background: none; border: none; color: var(--ink); font-size: 13px;
    font-family: inherit; outline: none; width: 100%;
  }
  .filters-aside .field input::placeholder { color: var(--ink-tertiary); }
  /* Native <select> popups don't inherit page CSS -- see the .toolbar
     select option comment above for the measured contrast reasoning;
     same fix, same failure, a second control this time. */
  .filters-aside .field select option { background: var(--row); color: var(--ink); }

  /* A hand-rolled dropdown for Industry/Function -- see wireCombobox().
     A native `list=`-backed <input> was tried first and dropped:
     Chrome shows a datalist's suggestions only after the reader has
     already typed a character into an empty field, so clicking one
     produced no visible reaction at all (confirmed live, read by a
     reader as "the dropdown doesn't work" rather than "type to
     search"), and calling showPicker() to force it open turned out to
     throw "requires a user gesture" even from inside a real click
     handler in this app's own testing -- not dependable enough to ship
     as the ONLY way to reach 330 industry values. */
  .combo-field { position: relative; }
  .combo-menu {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 40;
    max-height: 260px; overflow-y: auto;
    background: var(--row); border: 1px solid var(--border-strong); border-radius: 5px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    padding: 4px;
  }
  .combo-option {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    width: 100%; text-align: left; background: none; border: none; color: var(--ink);
    font-family: inherit; font-size: 12.5px; padding: 6px 8px; border-radius: 4px; cursor: pointer;
  }
  .combo-option .truncate { min-width: 0; flex: 1; }
  .combo-option:hover, .combo-option.active { background: var(--row-hover); }
  .combo-option .n { color: var(--ink-tertiary); font-size: 11px; font-family: ui-monospace, monospace; flex-shrink: 0; }
  .combo-empty { padding: 6px 8px; color: var(--ink-tertiary); font-size: 12px; }

  /* Anywhere/Remote/Hybrid/Onsite, Any/Summer/Fall/..., Any time/Past
     week/... -- every small fixed-choice axis in the panel uses the same
     equal-width pill row instead of three different `<select>` looks. */
  .pill-group { display: flex; flex-wrap: wrap; gap: 4px; border: 1px solid var(--border); border-radius: 5px; padding: 3px; }
  .pill-btn {
    flex: 1 1 auto; background: none; border: none; color: var(--ink-tertiary);
    font-family: inherit; font-size: 12px; font-weight: 500; border-radius: 4px;
    padding: 6px 8px; cursor: pointer; white-space: nowrap;
  }
  .pill-btn:hover { color: var(--ink); }
  .pill-btn.active { background: var(--border-strong); color: var(--ink); }

  /* Mobile: no room for a side-by-side panel, so the exact same element
     becomes a fixed bottom sheet -- one implementation, position
     strategy picked by media query rather than a second component. */
  @media (max-width: 1023.98px) {
    .filters-aside.open {
      position: fixed; inset: auto 0 0 0; top: auto; z-index: 60;
      width: auto; max-height: 85vh;
      border-radius: 10px 10px 0 0; box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.5);
    }
  }

  .filters-backdrop {
    display: none; position: fixed; inset: 0; z-index: 55;
    background: rgba(0, 0, 0, 0.5);
  }
  .filters-backdrop.visible { display: block; }
  @media (min-width: 1024px) {
    /* Desktop panel is persistent, non-modal -- no dimming, both the
       list and the panel stay usable at once. */
    .filters-backdrop { display: none !important; }
  }

  /* --- pagination ---------------------------------------------------- */

  .pager {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 14px 0; flex-wrap: wrap;
  }
  .pager:empty { padding: 0; }
  .pager-status { color: var(--ink-secondary); font-size: 12.5px; }
  .pager-range { color: var(--ink-tertiary); }
  .pager-btn {
    background: var(--row); border: 1px solid var(--border); color: var(--ink);
    border-radius: 4px; padding: 6px 12px; font-size: 12.5px; font-family: inherit;
    cursor: pointer;
  }
  .pager-btn:hover:not(:disabled) { border-color: var(--border-strong); }
  .pager-btn:disabled { color: var(--ink-tertiary); cursor: default; opacity: 0.5; }
  .pager-size {
    background: none; border: none; color: var(--ink-tertiary); font-size: 12px;
    font-family: inherit;
  }
  #feed-pager-top:not(:empty) { border-bottom: 1px solid var(--border); margin-bottom: 4px; }

  footer {
    border-top: 1px solid var(--border);
    color: var(--ink-tertiary);
    font-size: 12px;
    margin-top: 32px;
  }
  footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding-top: 16px; padding-bottom: 40px; }
  footer a { color: var(--ink-tertiary); }
  footer a:hover { color: var(--accent); }

  /* Below this width a 5-column table can only be read by dragging it
     sideways (its min-content width measured 1680px against a 390px
     phone viewport). Each row becomes a stacked card instead, labelled
     from the data-label attributes the renderers set. */
  @media (max-width: 719px) {
    :root { --gutter: 16px; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: auto; }
    tbody tr { padding: 12px 0; }
    tbody td { padding: 2px 0; white-space: normal; overflow: visible; }
    tbody td:empty { display: none; }
    td[data-label]::before {
      content: attr(data-label);
      display: inline-block;
      min-width: 74px;
      color: var(--ink-tertiary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    td.title-cell { font-size: 15px; margin-bottom: 4px; }
    td.title-cell::before { display: none; }
    .age-cell, .num-cell { text-align: left; }
    .truncate { white-space: normal; }
  }

  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="header-top">
      <div class="brand"><h1>Internship Feed</h1></div>
      <div class="status-line">
        <div class="events-wrap">
          <button class="events-badge" id="events-badge" aria-haspopup="true" aria-expanded="false"></button>
          <div class="events-panel" id="events-panel" role="region" aria-label="Recent source events"></div>
        </div>
        <span class="status-dot" id="health-dot"></span>
        <span id="health-sub">checking API&hellip;</span>
      </div>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- Postings, Sources, Discovery and Duplicates used to be four
       separate tabs -- four toolbars, four mental models, for data that
       a single search bar and filter panel can narrow just as well. The
       "View" lens at the top of the panel (below) picks which one is
       showing; everything else in the panel and the search bar above
       the table is shared. Kept the id "tab-feed" rather than renaming
       it -- nothing about the id is tab-specific, and renaming it would
       have meant touching every wireSortable/applySort/scrollIntoView
       call below for no behavioral change. -->
  <section id="tab-feed">
    <div class="feed-layout">
      <div class="feed-main">
        <!-- The search bar IS the toolbar now, for all four views: the
             filter toggle lives embedded in its own trailing edge (with
             the active-count badge) instead of sitting as a separate
             button beside it, and preset moved into the panel above as
             just another section -- one control at the top of the page,
             not four toolbars behind four tabs. What the box actually
             searches (title+company vs. company alone) and its
             placeholder both switch with the View lens; see
             updateSearchPlaceholder(). -->
        <div class="search-embedded">
          <span class="search-embedded-icon" aria-hidden="true">&#9906;</span>
          <input type="search" id="search" placeholder="Search title or company&hellip;">
          <button type="button" id="filters-toggle" class="search-embedded-filter-btn"
                  aria-haspopup="true" aria-expanded="false" aria-controls="filters-aside" aria-label="Filters">
            &#9776;<span id="filters-badge" class="filters-badge">0</span>
          </button>
        </div>

        <div id="tab-feed-postings" data-view="postings">
          <div id="feed-pager-top" class="pager"></div>
          <div class="result-line" aria-live="polite">
            <span id="feed-count"></span>
            <span id="feed-sort-line"></span>
          </div>
          <table>
            <colgroup>
              <!-- Weighted by what someone scanning a job feed actually
                   reads first: title, then who it's at, then what field,
                   then where. Company and Location wrap onto a second
                   line instead of a hard ellipsis cut now (see
                   .company-cell/.location-cell below) -- "Nexstar Media
                   Group, Inc." read as truncated garbage at the old 16%,
                   and no fixed width was ever going to fit every real
                   company name on one line anyway. -->
              <col style="width:28%"><col style="width:20%"><col style="width:14%"><col style="width:18%"><col style="width:10%"><col style="width:10%">
            </colgroup>
            <thead>
              <tr>
                <th scope="col"><button class="sort-btn" data-sort="title">Title</button></th>
                <th scope="col"><button class="sort-btn" data-sort="company">Company</button></th>
                <th scope="col"><button class="sort-btn" data-sort="location">Location</button></th>
                <th scope="col"><button class="sort-btn" data-sort="category">Category</button></th>
                <th scope="col" class="num"><button class="sort-btn" data-sort="posted_at_ts" title="When the employer posted the job">Posted</button></th>
                <th scope="col" class="num"><button class="sort-btn" data-sort="first_seen" title="When this feed first pulled the posting — not the same as Posted">Found</button></th>
              </tr>
            </thead>
            <tbody id="feed-body"></tbody>
          </table>
          <div id="feed-pager" class="pager"></div>
        </div>

        <div id="tab-sources" data-view="sources" hidden>
          <div class="result-line" aria-live="polite"><span id="sources-count"></span></div>
          <table>
            <colgroup>
              <col style="width:26%"><col style="width:11%"><col style="width:21%"><col style="width:12%"><col style="width:11%"><col style="width:9%"><col style="width:10%">
            </colgroup>
            <thead>
              <tr>
                <th scope="col"><button class="sort-btn" data-sort="company">Company</button></th>
                <th scope="col"><button class="sort-btn" data-sort="ats">ATS</button></th>
                <th scope="col"><button class="sort-btn" data-sort="category">Category</button></th>
                <th scope="col"><button class="sort-btn" data-sort="status">Status</button></th>
                <th scope="col"><button class="sort-btn" data-sort="added_by">Added by</button></th>
                <th scope="col" class="num"><button class="sort-btn" data-sort="consecutive_failures">Failures</button></th>
                <th scope="col" class="num"><button class="sort-btn" data-sort="last_scraped_at">Scraped</button></th>
              </tr>
            </thead>
            <tbody id="sources-body"></tbody>
          </table>
        </div>

        <div id="tab-candidates" data-view="discovery" hidden>
          <div class="result-line" aria-live="polite"><span id="candidates-count"></span></div>
          <table>
            <colgroup>
              <col style="width:22%"><col style="width:11%"><col style="width:11%"><col style="width:46%"><col style="width:10%">
            </colgroup>
            <thead>
              <tr>
                <th scope="col"><button class="sort-btn" data-sort="company">Company</button></th>
                <th scope="col"><button class="sort-btn" data-sort="ats">ATS guess</button></th>
                <th scope="col"><button class="sort-btn" data-sort="review_status">Status</button></th>
                <th scope="col">Reason</th>
                <th scope="col" class="num"><button class="sort-btn" data-sort="checked_at">Checked</button></th>
              </tr>
            </thead>
            <tbody id="candidates-body"></tbody>
          </table>
        </div>

        <div id="tab-duplicates" data-view="duplicates" hidden>
          <div class="result-line" aria-live="polite"><span id="duplicates-count"></span></div>
          <table>
            <colgroup>
              <col style="width:34%"><col style="width:12%"><col style="width:34%"><col style="width:10%">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">Duplicate</th>
                <th scope="col"><button class="sort-btn" data-sort="source">Source</button></th>
                <th scope="col">Canonical (kept open)</th>
                <th scope="col" class="num"><button class="sort-btn" data-sort="first_seen" title="When this feed first pulled the posting">Found</button></th>
              </tr>
            </thead>
            <tbody id="duplicates-body"></tbody>
          </table>
        </div>
      </div>

      <!-- A docked panel, not a popover: on desktop this is a real flex
           SIBLING of .feed-main above, so opening it reflows the table
           column instead of floating on top of it. On a narrow viewport
           the same element becomes a fixed bottom sheet (see the
           @media rule on .filters-aside.open) -- one element, two
           position strategies, picked by CSS rather than duplicated
           markup. Starts closed; the search bar's own embedded toggle
           opens it. -->
      <aside id="filters-aside" class="filters-aside" aria-label="Filters">
        <div class="filters-aside-header">
          <span class="title">Filters</span>
          <div class="filters-aside-actions">
            <button type="button" id="filters-reset" class="btn-link" hidden>Reset all</button>
            <button type="button" id="filters-collapse-all" class="icon-btn" aria-label="Collapse all sections" title="Collapse all">&#8963;</button>
            <button type="button" id="filters-close" class="icon-btn" aria-label="Close filters">&times;</button>
          </div>
        </div>
        <div class="filters-aside-body">
          <!-- The one section every view keeps: which of the four data
               sets is showing. Always exactly one value, no "off" state
               -- a lens, not an optional filter, so it wires through
               wireLensGroup() rather than the toggle-to-clear
               wirePillGroup() the optional axes below use. -->
          <div class="filter-section" data-view="all" data-section="view">
            <button type="button" class="filter-section-toggle"><span>View</span><span class="filter-section-chevron" aria-hidden="true">&#9662;</span></button>
            <div class="filter-section-body">
              <div id="feed-view" class="pill-group" data-value="postings">
                <button type="button" class="pill-btn active" data-value="postings">Postings</button>
                <button type="button" class="pill-btn" data-value="sources">Sources</button>
                <button type="button" class="pill-btn" data-value="discovery">Discovery</button>
                <button type="button" class="pill-btn" data-value="duplicates">Duplicates</button>
              </div>
            </div>
          </div>
          <div class="filter-section" data-view="postings" data-section="preset">
            <button type="button" class="filter-section-toggle"><span>Preset</span><span class="filter-section-chevron" aria-hidden="true">&#9662;</span></button>
            <div class="filter-section-body">
              <div class="field"><select id="preset"></select></div>
            </div>
          </div>
          <!-- Comboboxes, not <select>s, for industry/function: the
               industry taxonomy alone is ~330 labels, and an alphabetical
               dropdown that long is a scroll, not a control. <input list>
               gives native typeahead with no build step, and each
               datalist is ordered by open-posting count so the values
               that actually return something come first.

               TWO controls because there are two axes. Industry is what
               the EMPLOYER does and only direct boards know it; function
               is what the JOB is and only aggregators indexing by
               function know it. They shared one column until 2026-08-17
               and the vocabularies were disjoint. -->
          <div class="filter-section" data-view="postings" data-section="industry">
            <button type="button" class="filter-section-toggle"><span>Industry</span><span class="filter-section-chevron" aria-hidden="true">&#9662;</span></button>
            <div class="filter-section-body">
              <div class="field combo-field">
                <input id="feed-category" autocomplete="off" role="combobox" aria-expanded="false"
                       placeholder="Any industry" aria-describedby="category-hint">
                <!-- The dropdown itself is a hand-rolled listbox (see
                     wireCombobox()), not this element -- kept only as
                     the option DATA, since a native `list=` combobox's
                     suggestion popup turned out unreliable across real
                     browsers (see wireCombobox()'s own comment). -->
                <datalist id="category-options"></datalist>
              </div>
            </div>
          </div>
          <div class="filter-section" data-view="postings" data-section="function">
            <button type="button" class="filter-section-toggle"><span>Function</span><span class="filter-section-chevron" aria-hidden="true">&#9662;</span></button>
            <div class="filter-section-body">
              <div class="field combo-field">
                <input id="feed-function" autocomplete="off" role="combobox" aria-expanded="false"
                       placeholder="Any function" aria-describedby="category-hint">
                <datalist id="function-options"></datalist>
              </div>
              <!-- aria-live so a screen-reader user hears that their typed
                   text matched nothing, rather than silently getting the
                   whole feed back with no explanation of why. Shared by
                   both axes since only one is ever non-empty at a time. -->
              <span id="category-hint" class="field-hint" role="status" aria-live="polite"></span>
            </div>
          </div>
          <div class="filter-section" data-view="postings" data-section="where">
            <button type="button" class="filter-section-toggle"><span>Where</span><span class="filter-section-chevron" aria-hidden="true">&#9662;</span></button>
            <div class="filter-section-body">
              <div id="feed-arrangement" class="pill-group" data-value="">
                <button type="button" class="pill-btn active" data-value="">Anywhere</button>
              </div>
            </div>
          </div>
          <!-- A real place, not an arrangement -- "Where" above answers
               remote/hybrid/onsite, this answers "New York" vs "Austin".
               Free text rather than a combobox: the corpus holds 1,785
               distinct location strings, too many to enumerate, and the
               server already does a word-boundary substring match
               (locations_include, shared with preset filtering) so a
               partial city name works fine without a fixed vocabulary.
               Clicking a location in the table (see locationHtml())
               fills this in directly. -->
          <div class="filter-section" data-view="postings" data-section="location">
            <button type="button" class="filter-section-toggle"><span>Location</span><span class="filter-section-chevron" aria-hidden="true">&#9662;</span></button>
            <div class="filter-section-body">
              <div class="field">
                <input id="feed-location" autocomplete="off" placeholder="e.g. Austin, New York, London">
              </div>
            </div>
          </div>
          <!-- The cycle a posting advertises. Internships are seasonal,
               and in August 2026 the live question is "what is open for
               Summer 2027" -- which was unaskable until titles were
               parsed for it. Coverage is only ~40%, which the hint
               states rather than hides. -->
          <div class="filter-section" data-view="postings" data-section="cycle">
            <button type="button" class="filter-section-toggle"><span>Cycle</span><span class="filter-section-chevron" aria-hidden="true">&#9662;</span></button>
            <div class="filter-section-body">
              <div id="feed-cycle-season" class="pill-group" data-value="">
                <button type="button" class="pill-btn active" data-value="">Any season</button>
              </div>
              <div class="field"><select id="feed-cycle-year"><option value="">Any year</option></select></div>
            </div>
          </div>
          <div class="filter-section" data-view="postings" data-section="age">
            <button type="button" class="filter-section-toggle"><span>Posted</span><span class="filter-section-chevron" aria-hidden="true">&#9662;</span></button>

          <!-- What each status means used to be a standing paragraph on

                  <option value="rejected" title="A board was found, but the trial fetch failed verification (zero postings, no internship-shaped titles, all-identical titles, or a company name that didn't match) -- see Reason.">Rejected</option>

  </div>
</footer>

<script>
// "all" is the API's reserved no-filter sentinel (see service/api.py's
// ALL_POSTINGS), and it is the DEFAULT landing view -- operator ruling,
// 2026-08-17. Measured cause: only 7.6% of the corpus (355 of 4,644
// postings, 72 of 579 companies) matched the old supply-chain default,
// so the landing page hid ~92% of what the scrapers actually collect and
// nearly all recent work was invisible until a reader changed a dropdown
// they had no reason to suspect. Supply Chain is now one interest among
// eight rather than the frame around everything.
//
// The fork's own filters.yaml is still reachable as "This fork's filter"
// -- forking and editing that file remains the documented way to make a
// narrow build, it just isn't imposed on this deployment's readers.
const DEFAULT_PRESET = "all";

const PRESETS = [
  ["all", "All internships"],
  ["operations-logistics-supply-chain", "Supply Chain"],
  ["software-engineering", "Software Engineering"],
  ["data-analytics", "Data Analytics"],
  ["finance", "Finance"],
  ["human-resources", "Human Resources"],
  ["marketing", "Marketing"],
  ["sales", "Sales"],
  ["", "This fork's filter (filters.yaml)"],
];

// A page, not a cap. This used to be 1000 with no way to go further,
// which left ~3800 of 4833 open postings unreachable from the UI -- the
// same shape as the old "every preset is a filter" gap, just smaller.
const FEED_PAGE_SIZE = 200;

const presetSelect = document.getElementById("preset");
for (const [value, label] of PRESETS) {
  const opt = document.createElement("option");
  opt.value = value;
  opt.textContent = label;
  presetSelect.appendChild(opt);
}
// Set before any ?preset= from the URL is applied, so a shared link still
// wins over the default.
presetSelect.value = DEFAULT_PRESET;

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function timeAgo(iso) {
  if (!iso) return "never";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const secs = Math.floor((Date.now() - d.getTime()) / 1000);
  if (secs < 60) return "just now";
  if (secs < 3600) return Math.floor(secs / 60) + "m ago";
  if (secs < 86400) return Math.floor(secs / 3600) + "h ago";
  return Math.floor(secs / 86400) + "d ago";
}

// Relative time is the right default for scanning ("2h ago" answers
// "is this fresh?" faster than a date does), but it throws away the
// actual timestamp -- so the exact local datetime goes in the title.
function exactTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString();
}

// How old a posting really is, which is the single most decision-
// relevant fact on the row and used to be wrong: this column showed
// first_seen -- when THIS system first saw the posting -- under a
// header reading "Posted". With a young database that made every row
// look hours old, including Lever postings whose real date was 2021.
//
// posted_at_ts is the provider's own date where one exists (99.3% of
// the open corpus). Where it doesn't, fall back to first_seen but SAY
// so rather than silently passing our discovery time off as theirs.
// `approx` marks values the provider only bounded or rounded (Workday's
// "30+ days ago"), rendered with a leading ~ so the row never implies
// precision nobody offered.
// POSTED and FOUND are two different facts and get two different
// columns. Posted is the employer's own date -- how old the opportunity
// actually is, and the one that decides whether it's worth applying to.
// Found is when this feed first pulled it, which only answers "is this
// new to me since I last looked". They can differ by years: the corpus
// holds postings from 2016 that this database first saw days ago.
//
// Critically, Posted does NOT fall back to Found. An earlier version put
// the pull time in the Posted column whenever a source gave no date,
// which is the exact conflation this split exists to remove -- it
// presented our discovery time as the employer's. When there's no real
// posting date the column says so, and Found (always present) carries
// the only date we do have.
function postedCell(p) {
  if (!p.posted_at_ts) {
    return {
      text: "unknown",
      cls: "unknown-date",
      title: "This source publishes no posting date. See the Found column for when this feed first pulled it — that is not the same thing.",
    };
  }
  const rel = timeAgo(p.posted_at_ts);
  if (!p.posted_at_approx) {
    return {
      text: rel,
      cls: "",
      label: `Posted ${rel}`,
      title: `Posted ${exactTime(p.posted_at_ts)}` +
             (p.posted_at ? `\nProvider value: ${p.posted_at}` : ""),
    };
  }
  // "+", not "~". These are LOWER BOUNDS on age, not fuzzy midpoints:
  // Workday stops counting at "Posted 30+ Days Ago", so the true age is
  // at least 30 days and may be far more (a saturated value is the
  // COMMON case, not an edge one -- 800 of 813 approximate postings are
  // Workday). "Posted 5 Days Ago" is likewise somewhere in [5, 6) days.
  // Every approximate value here is "at least this old", so "+" is
  // always the correct direction, where "~" implied a precision in both
  // directions that the provider never offered.
  return {
    text: `${rel}+`,
    cls: "approx-date",
    // Screen readers do not reliably announce title, and a bare "+" is
    // not something a reader can be expected to decode.
    label: `Posted at least ${rel} — the source gives a bound, not a date`,
    title: "The provider published a bounded age, not a date — this posting is " +
           "AT LEAST this old and may be considerably older.\n" +
           `Not later than ${exactTime(p.posted_at_ts)}` +
           (p.posted_at ? `\nProvider value: ${p.posted_at}` : ""),
  };
}

function foundCell(p) {
  return {
    text: timeAgo(p.first_seen),
    title: `This feed first pulled this posting ${exactTime(p.first_seen)}. This is our discovery time, not the employer's posting date.`,
  };
}

function emptyRow(colspan, message) {
  return `<tr><td colspan="${colspan}"><div class="empty">${escapeHtml(message)}</div></td></tr>`;
}

// A category dot used to be one flat --accent-dim for every category --
// decorative, not informative, and worse than no dot at all since it
// visually promises colour-coding it doesn't deliver. This gives each
// category a stable colour derived from its own name, so the same
// category always renders the same hue everywhere the tag appears.
// Hue-only (fixed S/L tuned for the dark canvas) keeps every generated
// colour at roughly equal perceived brightness, rather than risking a
// hash landing on near-black or near-white.
// One column, two axes. A posting carries an industry OR a function,
// never both, so showing only `category` would have left 58% of rows
// blank the moment the two were split apart. Whichever is known is
// shown, and which axis it is has to be recoverable -- "Healthcare" the
// function and "Healthcare Services" the industry are different claims,
// and a reader who cannot tell them apart is back where they started.
// A button, not a plain span: it already carries the exact filter
// value a reader would otherwise have to retype into Industry or
// Function -- rendering it as inert text just to look tidy would waste
// that. data-filter-axis/-value are read by the single delegated click
// handler wired near applyCellFilter() below, the same pattern the
// entity-link routing already uses for postings/companies/sources.
function categoryCell(p) {
  const industry = p.category || "";
  const fn = p.job_function || "";
  const value = industry || fn;
  if (!value) return "";
  const isFunction = !industry && !!fn;
  const axis = isFunction ? "function" : "industry";
  const title = isFunction
    ? `Job function: ${value} (this source does not report the employer's industry) -- click to filter by it`
    : `Employer industry: ${value} -- click to filter by it`;
  return `<button type="button" class="swatch-tag${isFunction ? " is-function" : ""}" ` +
         `style="--swatch-color:${categoryColor(value)}" title="${escapeHtml(title)}" ` +
         `data-filter-axis="${axis}" data-filter-value="${escapeHtml(value)}">` +
         `<span class="swatch-label">${escapeHtml(value)}</span></button>`;
}

function categoryColor(category) {
  let hash = 0;
  for (let i = 0; i < category.length; i++) hash = (hash * 31 + category.charCodeAt(i)) >>> 0;
  return `hsl(${hash % 360}, 55%, 62%)`;
}

function populateCategoryOptions(selectEl, rows) {
  const categories = [...new Set(rows.map(r => r.category).filter(Boolean))].sort();
  const current = selectEl.value;
  selectEl.innerHTML = '<option value="">All</option>' +
    categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  if (categories.includes(current)) selectEl.value = current;
}

// Same shape as populateCategoryOptions but for any already-distinct
// value list (Sources' ATS column, computed client-side; Discovery's,
// which the server hands back as `ats_options` since that view is
// paged and a client-side distinct would only ever see the current
// page). Preserves the current selection across a re-population the
// same way populateCategoryOptions does.
function populateSelectValues(selectEl, values) {
  const current = selectEl.value;
  selectEl.innerHTML = '<option value="">All</option>' +
    values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
  if (values.includes(current)) selectEl.value = current;
}

// The feed's own category control is a combobox rather than a <select>,
// so it fills a <datalist> instead. Ordered by open-posting count, with
// the count shown as the option's label -- browsers render that beside
// the value, which turns "which of these 310 is worth picking" from a
// guess into a visible number.
// One implementation, two axes. `_axis` rows arrive as {value,
// open_postings} from /categories.
const AXES = {
  industry: { input: "feed-category", list: "category-options", names: new Set(), label: "industry" },
  function: { input: "feed-function", list: "function-options", names: new Set(), label: "function" },
};
let feedCoverage = null;

// Real <select>s rather than the comboboxes the taxonomy axes use:
// there are four seasons and a handful of years, so a closed list is
// both complete and shorter than typing.
function populateCycleSelect(id, rows, anyLabel, format) {
  const el = document.getElementById(id);
  const current = el.value;
  el.innerHTML = `<option value="">${anyLabel}</option>` + rows.map(r =>
    `<option value="${escapeHtml(String(r.value))}">${escapeHtml(format(r.value))} (${r.open_postings})</option>`
  ).join("");
  if ([...el.options].some(o => o.value === current)) el.value = current;
}

// Anywhere/Remote/Hybrid/..., Any season/Summer/Fall/..., Any time/Past
// week/... -- every small fixed-choice axis in the panel is a row of
// pill buttons rather than a <select>, matching the panel's own visual
// language. The container stands in for a form control: its
// `dataset.value` IS the current value, read by pillValue() and written
// by setPillValue(), and a real "change" Event is dispatched on it so
// existing `el.addEventListener("change", ...)` wiring works unchanged
// whether the target is this or a native <select> (cycle year still is
// one -- numeric and open-ended, unlike four seasons or five age
// buckets).
function pillValue(id) {
  return document.getElementById(id).dataset.value || "";
}

function setPillValue(id, value, { silent = false } = {}) {
  const el = document.getElementById(id);
  el.dataset.value = value;
  el.querySelectorAll(".pill-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.value === value));
  if (!silent) el.dispatchEvent(new Event("change"));
}

// Re-clicking the already-active pill clears back to "" -- these are
// optional filters being narrowed, not a required lens that always has
// exactly one value.
function wirePillGroup(id) {
  document.getElementById(id).querySelectorAll(".pill-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      setPillValue(id, btn.dataset.value === pillValue(id) ? "" : btn.dataset.value);
    });
  });
}

// A lens, not an optional filter: always exactly one value, and
// re-clicking the active pill is a no-op rather than clearing it. The
// View control (Postings/Sources/Discovery/Duplicates) is the only pill
// group this applies to -- every other pill group narrows a result set
// that still makes sense with nothing selected, but "no view" isn't a
// real state.
function wireLensGroup(id) {
  document.getElementById(id).querySelectorAll(".pill-btn").forEach(btn => {
    btn.addEventListener("click", () => setPillValue(id, btn.dataset.value));
  });
}

function populatePillGroup(id, rows, anyLabel, format) {
  const el = document.getElementById(id);
  const current = el.dataset.value || "";
  el.innerHTML = `<button type="button" class="pill-btn" data-value="">${escapeHtml(anyLabel)}</button>` + rows.map(r =>
    `<button type="button" class="pill-btn" data-value="${escapeHtml(String(r.value))}">${escapeHtml(format(r.value))} (${r.open_postings})</button>`
  ).join("");
  wirePillGroup(id);
  const stillValid = current === "" || [...el.querySelectorAll(".pill-btn")].some(b => b.dataset.value === current);
  setPillValue(id, stillValid ? current : "", { silent: true });
}

function populateAxisDatalist(axis, rows) {
  axis.names = new Set(rows.map(r => r.value));
  document.getElementById(axis.list).innerHTML = rows.map(r =>
    `<option value="${escapeHtml(r.value)}" label="${escapeHtml(r.value)} — ${r.open_postings}"></option>`
  ).join("");
}

// A typed value only filters when it names a real value on that axis.
// Anything else is treated as "any" rather than silently returning zero
// rows, which is what an exact-match filter over free text would
// otherwise do on every partially-typed word.
function axisValue(axis) {
  const raw = document.getElementById(axis.input).value.trim();
  if (!raw) return "";
  if (axis.names.has(raw)) return raw;
  const ci = [...axis.names].find(c => c.toLowerCase() === raw.toLowerCase());
  return ci || "";
}

// A hand-rolled dropdown, not a native `list=` combobox -- see the
// .combo-menu CSS comment for why the native version was dropped.
// Reads its options straight from the axis's own <datalist> (already
// populated by populateAxisDatalist), so there is exactly one place
// that holds "what industries/functions exist", not two that could
// drift.
const COMBO_MAX_OPTIONS = 60;

function wireCombobox(axis) {
  const input = document.getElementById(axis.input);
  const field = input.closest(".field");
  const menu = document.createElement("div");
  menu.className = "combo-menu";
  menu.id = `${axis.input}-menu`;
  menu.hidden = true;
  menu.setAttribute("role", "listbox");
  field.appendChild(menu);
  input.setAttribute("aria-controls", menu.id);

  function matches(query) {
    const datalist = document.getElementById(axis.list);
    const opts = [...datalist.options].map(o => ({
      value: o.value,
      label: o.getAttribute("label") || o.value,
    }));
    const q = query.trim().toLowerCase();
    // Ranked, not just filtered: a name that STARTS WITH what was typed
    // reads as the more relevant match than one that merely contains it
    // somewhere in the middle, and the datalist's own count-descending
    // order is only meaningful as a tiebreaker within each of those two
    // groups, not across them.
    if (!q) return opts.slice(0, COMBO_MAX_OPTIONS);
    const starts = opts.filter(o => o.value.toLowerCase().startsWith(q));
    const contains = opts.filter(o => !o.value.toLowerCase().startsWith(q) && o.value.toLowerCase().includes(q));
    return [...starts, ...contains].slice(0, COMBO_MAX_OPTIONS);
  }

  function render() {
    const opts = matches(input.value);
    menu.innerHTML = opts.length
      ? opts.map(o => {
          const [, label, count] = o.label.match(/^(.*) — (\d+)$/) || [null, o.label, null];
          return `<button type="button" class="combo-option" role="option" data-value="${escapeHtml(o.value)}">` +
                 `<span class="truncate">${escapeHtml(label)}</span>` +
                 (count ? `<span class="n">${escapeHtml(count)}</span>` : "") +
                 `</button>`;
        }).join("")
      : `<div class="combo-empty">No match</div>`;
    menu.hidden = false;
    input.setAttribute("aria-expanded", "true");
  }

  function close() {
    menu.hidden = true;
    input.setAttribute("aria-expanded", "false");
  }

  input.addEventListener("focus", render);
  input.addEventListener("click", render);
  input.addEventListener("input", render);
  // Keydown, not blur alone: Escape should close the menu without also
  // leaving the field, which a blur-driven close would do as a side
  // effect of moving focus.
  input.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  // Genuinely leaving the field (not clicking into the menu itself,
  // which also blurs the input) is the one thing that should close it.
  input.addEventListener("blur", () => { if (!menu.matches(":hover")) close(); });
  // mousedown, not click: fires BEFORE the input's blur, so the value
  // is captured before the menu closes and disappears out from under
  // the click.
  menu.addEventListener("mousedown", (e) => {
    const opt = e.target.closest(".combo-option");
    if (!opt) return;
    e.preventDefault();
    input.value = opt.dataset.value;
    close();
    input.dispatchEvent(new Event("input", { bubbles: true }));
  });
}

const feedCategoryValue = () => axisValue(AXES.industry);
const feedFunctionValue = () => axisValue(AXES.function);

// Two distinct things to say, and both matter.
//
// A typo needs naming, or the reader silently gets the whole feed back.
// And COVERAGE needs naming, because neither axis spans the corpus:
// only direct boards report an industry, only aggregators report a
// function. Filtering by industry therefore excludes every aggregator
// posting -- not a bug, but invisible unless said out loud, and an
// invisible filter hiding most of the corpus is precisely the failure
// this split was made to fix.
function syncCategoryHint() {
  const hint = document.getElementById("category-hint");
  if (!hint) return;
  const messages = [];
  for (const axis of [AXES.industry, AXES.function]) {
    const raw = document.getElementById(axis.input).value.trim();
    if (raw && !axisValue(axis)) messages.push(`no ${axis.label} named “${raw}” — ignoring it`);
  }
  if (!messages.length && feedCoverage) {
    const industry = feedCategoryValue(), fn = feedFunctionValue();
    if (industry && fn) {
      messages.push("industry and function rarely coexist on one posting — expect few results");
    } else if (industry) {
      messages.push(`industry is known for ${feedCoverage.with_industry.toLocaleString()} of ` +
                    `${feedCoverage.total.toLocaleString()} open postings`);
    } else if (fn) {
      messages.push(`function is known for ${feedCoverage.with_function.toLocaleString()} of ` +
                    `${feedCoverage.total.toLocaleString()} open postings`);
    }
  }
  hint.textContent = messages.join(" · ");
  hint.classList.toggle("is-warning", messages.some(m => m.startsWith("no ")));
}

function sortRows(rows, key, dir) {
  return [...rows].sort((a, b) => {
    const av = a[key] ?? "";
    const bv = b[key] ?? "";
    // A missing value sorts LAST in whichever direction is active,
    // rather than winning "newest first" by virtue of being empty --
    // postings whose source gave no date shouldn't head the feed.
    if (av === "" && bv === "") return 0;
    if (av === "") return 1;
    if (bv === "") return -1;
    if (av < bv) return -1 * dir;
    if (av > bv) return 1 * dir;
    return 0;
  });
}

// Sort state lives on the <th> as aria-sort so the control announces its
// own state instead of only drawing a caret sighted users can see.
function applySort(containerId, state) {
  document.querySelectorAll(`#${containerId} .sort-btn`).forEach(btn => {
    const th = btn.closest("th");
    const caret = btn.querySelector(".sort-caret");
    if (caret) caret.remove();
    if (btn.dataset.sort === state.key) {
      th.setAttribute("aria-sort", state.dir === 1 ? "ascending" : "descending");
      btn.insertAdjacentHTML("beforeend", `<span class="sort-caret" aria-hidden="true">${state.dir === 1 ? "▲" : "▼"}</span>`);
    } else {
      th.removeAttribute("aria-sort");
    }
  });
}

function wireSortable(containerId, state, renderFn, dateKeys = []) {
  document.querySelectorAll(`#${containerId} .sort-btn`).forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.sort;
      // Dates default to newest-first; text defaults to A-Z. Toggling an
      // already-active column just flips it.
      state.dir = state.key === key ? -state.dir : (dateKeys.includes(key) ? -1 : 1);
      state.key = key;
      renderFn();
    });
  });
}

// Search runs on every keystroke and rebuilds the whole tbody; measured
// at ~13ms for 356 rows, so it scales to ~36ms at the 1000-row cap --
// enough to feel like lag while typing. Debounced so a burst of
// keystrokes costs one render, not one per character.
function debounce(fn, ms = 140) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

// --- URL state ----------------------------------------------------------
// Filters live in the query string so a filtered view is linkable,
// bookmarkable and survives a refresh. Previously every reload dumped you
// back on the default preset with your search cleared.

function syncUrl() {
  // An entity page owns the query string while it's open; rewriting it
  // from the feed's filters here would bounce the reader out of the page
  // they just opened.
  if (activeDetailRoute()) return;
  const p = new URLSearchParams();
  const view = pillValue("feed-view");
  if (view !== "postings") p.set("view", view);
  const q = document.getElementById("search").value.trim();
  if (q) p.set("q", q);
  // Every filter param below belongs to ONE view -- writing it
  // regardless of which view is active would let a Postings filter you
  // set earlier and never cleared leak into a Sources deep link that
  // has nothing to do with it.
  if (view === "postings") {
    // The default is omitted so a plain "/" stays clean, but ANY other
    // choice is written -- including the empty-string fork filter, which
    // would otherwise be indistinguishable from "nothing chosen" and snap
    // back to the default on reload.
    if (presetSelect.value !== DEFAULT_PRESET) p.set("preset", presetSelect.value);
    const cat = feedCategoryValue();
    if (cat) p.set("category", cat);
    const fn = feedFunctionValue();
    if (fn) p.set("function", fn);
    const season = pillValue("feed-cycle-season");
    if (season) p.set("season", season);
    const year = document.getElementById("feed-cycle-year").value;
    if (year) p.set("year", year);
    const where = pillValue("feed-arrangement");
    if (where) p.set("where", where);
    const location = document.getElementById("feed-location").value.trim();
    if (location) p.set("location", location);
    const age = pillValue("feed-age");
    if (age) p.set("age", age);
  } else if (view === "sources") {
    const category = document.getElementById("source-category").value;
    if (category) p.set("source_category", category);
    const ats = document.getElementById("source-ats").value;
    if (ats) p.set("source_ats", ats);
    const status = document.getElementById("source-status").value;
    if (status) p.set("source_status", status);
  } else if (view === "discovery") {
    const status = document.getElementById("candidate-status").value;
    if (status) p.set("candidate_status", status);
    const ats = document.getElementById("candidate-ats").value;
    if (ats) p.set("candidate_ats", ats);
  }
  const qs = p.toString();
  history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
}
