<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship Feed</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --dim: #9aa2b1;
    --accent: #4f8cff;
    --green: #2e7d32;
    --amber: #b8860b;
    --red: #b03a3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--dim); font-size: 13px; }
  nav {
    display: flex;
    gap: 4px;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
  }
  nav button {
    background: none;
    border: none;
    color: var(--dim);
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .controls input, .controls select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  .controls input[type="text"] { flex: 1; min-width: 180px; }
  .count { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 10px;
  }
  .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .card-top a { color: var(--text); font-weight: 600; text-decoration: none; font-size: 15px; }
  .card-top a:hover { color: var(--accent); }
  .company { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #222634;
    color: var(--dim);
    border: 1px solid var(--border);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 500; }
  .status-active { color: var(--green); }
  .status-probation { color: var(--amber); }
  .status-disabled, .status-rejected { color: var(--red); }
  .status-promoted { color: var(--green); }
  .status-no_match { color: var(--dim); }
  .status-open { color: var(--green); }
  .empty { color: var(--dim); padding: 30px 0; text-align: center; }
  footer { text-align: center; color: var(--dim); font-size: 12px; padding: 24px; }
  footer a { color: var(--dim); }
</style>
</head>
<body>

<header>
  <h1>Internship Feed</h1>
  <span class="sub" id="health-sub">checking API…</span>
</header>

<nav>
  <button data-tab="feed" class="active">Feed</button>
  <button data-tab="sources">Sources</button>
  <button data-tab="candidates">Discovery</button>
</nav>

<main>

  <section id="tab-feed">
    <div class="controls">
      <select id="preset"></select>
      <input type="text" id="search" placeholder="Filter by title or company…">
    </div>
    <div class="count" id="feed-count"></div>
    <div id="feed-list"></div>
  </section>

  <section id="tab-sources" style="display:none">
    <div class="controls">
      <input type="text" id="source-search" placeholder="Filter by company…">
    </div>
    <table>
      <thead><tr><th>Company</th><th>ATS</th><th>Category</th><th>Status</th><th>Added by</th><th>Failures</th><th>Last scraped</th></tr></thead>
      <tbody id="sources-body"></tbody>
    </table>
  </section>

  <section id="tab-candidates" style="display:none">
    <div class="controls">
      <select id="candidate-status">
        <option value="">All statuses</option>
        <option value="promoted">Promoted</option>
        <option value="rejected">Rejected</option>
        <option value="no_match">No match</option>
        <option value="unchecked">Unchecked</option>
      </select>
      <input type="text" id="candidate-search" placeholder="Filter by company…">
    </div>
    <div class="count" id="candidates-count"></div>
    <table>
      <thead><tr><th>Company</th><th>ATS guess</th><th>Status</th><th>Checked</th></tr></thead>
      <tbody id="candidates-body"></tbody>
    </table>
  </section>

</main>

<footer>
  Sourced directly from company career sites — no third-party job-board
  aggregator in the loop. <a href="/feed" target="_blank">/feed</a> ·
  <a href="/sources" target="_blank">/sources</a> ·
  <a href="/candidates" target="_blank">/candidates</a>
</footer>

<script>
const PRESETS = [
  ["", "Default (this fork's filter)"],
  ["operations-logistics-supply-chain", "Operations / Logistics / Supply Chain"],
  ["software-engineering", "Software Engineering"],
  ["data-analytics", "Data / Analytics"],
  ["finance", "Finance"],
  ["human-resources", "Human Resources"],
  ["marketing", "Marketing"],
  ["sales", "Sales"],
];

const presetSelect = document.getElementById("preset");
for (const [value, label] of PRESETS) {
  const opt = document.createElement("option");
  opt.value = value;
  opt.textContent = label;
  presetSelect.appendChild(opt);
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function timeAgo(iso) {
  if (!iso) return "never";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const secs = Math.floor((Date.now() - d.getTime()) / 1000);
  if (secs < 60) return "just now";
  if (secs < 3600) return Math.floor(secs / 60) + "m ago";
  if (secs < 86400) return Math.floor(secs / 3600) + "h ago";
  return Math.floor(secs / 86400) + "d ago";
}

// --- feed tab ---------------------------------------------------------

let feedPostings = [];

async function loadFeed() {
  const preset = presetSelect.value;
  const url = preset ? `/feed?preset=${encodeURIComponent(preset)}&limit=1000` : `/feed?limit=1000`;
  document.getElementById("feed-count").textContent = "loading…";
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) {
      document.getElementById("feed-list").innerHTML = `<div class="empty">${escapeHtml(data.error)}</div>`;
      document.getElementById("feed-count").textContent = "";
      return;
    }
    feedPostings = data.postings || [];
    renderFeed();
  } catch (e) {
    document.getElementById("feed-list").innerHTML = `<div class="empty">Couldn't reach the API — is the service running?</div>`;
    document.getElementById("feed-count").textContent = "";
  }
}

function renderFeed() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const filtered = q
    ? feedPostings.filter(p =>
        (p.title || "").toLowerCase().includes(q) ||
        (p.company || "").toLowerCase().includes(q))
    : feedPostings;

  document.getElementById("feed-count").textContent =
    `${filtered.length} of ${feedPostings.length} open posting${feedPostings.length === 1 ? "" : "s"}`;

  const list = document.getElementById("feed-list");
  if (!filtered.length) {
    list.innerHTML = `<div class="empty">No postings match.</div>`;
    return;
  }
  list.innerHTML = filtered.map(p => `
    <div class="card">
      <div class="card-top">
        <a href="${escapeHtml(p.url)}" target="_blank" rel="noopener">${escapeHtml(p.title)}</a>
        <span class="tag">${escapeHtml(timeAgo(p.first_seen))}</span>
      </div>
      <div class="company">${escapeHtml(p.company)}${p.location ? " · " + escapeHtml(p.location) : ""}</div>
      <div class="meta">
        ${p.category ? `<span class="tag">${escapeHtml(p.category)}</span>` : ""}
        ${p.source ? `<span class="tag">${escapeHtml(p.source)}</span>` : ""}
      </div>
    </div>
  `).join("");
}

// --- sources tab --------------------------------------------------------

let sourceRows = [];

async function loadSources() {
  const res = await fetch("/sources");
  const data = await res.json();
  sourceRows = data.sources || [];
  renderSources();
}

function renderSources() {
  const q = document.getElementById("source-search").value.trim().toLowerCase();
  const filtered = q ? sourceRows.filter(s => (s.company || "").toLowerCase().includes(q)) : sourceRows;
  document.getElementById("sources-body").innerHTML = filtered.map(s => `
    <tr>
      <td>${escapeHtml(s.company)}</td>
      <td>${escapeHtml(s.ats)}</td>
      <td>${escapeHtml(s.category || "")}</td>
      <td class="status-${escapeHtml(s.status)}">${escapeHtml(s.status)}</td>
      <td>${escapeHtml(s.added_by)}</td>
      <td>${s.consecutive_failures}</td>
      <td>${timeAgo(s.last_scraped_at)}</td>
    </tr>
  `).join("") || `<tr><td colspan="7" class="empty">No sources.</td></tr>`;
}

// --- candidates tab -------------------------------------------------------

let candidateRows = [];

async function loadCandidates() {
  const res = await fetch("/candidates");
  const data = await res.json();
  candidateRows = data.candidates || [];
  renderCandidates();
}

function renderCandidates() {
  const q = document.getElementById("candidate-search").value.trim().toLowerCase();
  const statusFilter = document.getElementById("candidate-status").value;
  let filtered = candidateRows;
  if (q) filtered = filtered.filter(c => (c.company || "").toLowerCase().includes(q));
  if (statusFilter) filtered = filtered.filter(c => c.review_status === statusFilter);

  document.getElementById("candidates-count").textContent =
    `${filtered.length} of ${candidateRows.length} candidates`;

  document.getElementById("candidates-body").innerHTML = filtered.slice(0, 500).map(c => `
    <tr>
      <td>${escapeHtml(c.company)}</td>
      <td>${escapeHtml(c.ats || "")}</td>
      <td class="status-${escapeHtml(c.review_status)}">${escapeHtml(c.review_status)}</td>
      <td>${timeAgo(c.checked_at)}</td>
    </tr>
  `).join("") || `<tr><td colspan="4" class="empty">No candidates.</td></tr>`;
}

// --- tabs / wiring --------------------------------------------------------

const tabs = { feed: loadFeed, sources: loadSources, candidates: loadCandidates };
let loaded = {};

document.querySelectorAll("nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    for (const name of Object.keys(tabs)) {
      document.getElementById(`tab-${name}`).style.display = name === btn.dataset.tab ? "" : "none";
    }
    if (!loaded[btn.dataset.tab]) {
      loaded[btn.dataset.tab] = true;
      tabs[btn.dataset.tab]();
    }
  });
});

presetSelect.addEventListener("change", loadFeed);
document.getElementById("search").addEventListener("input", renderFeed);
document.getElementById("source-search").addEventListener("input", renderSources);
document.getElementById("candidate-search").addEventListener("input", renderCandidates);
document.getElementById("candidate-status").addEventListener("change", renderCandidates);

fetch("/health").then(r => r.json()).then(d => {
  document.getElementById("health-sub").textContent = d.ok ? "live" : "unhealthy";
}).catch(() => {
  document.getElementById("health-sub").textContent = "unreachable";
});

loaded.feed = true;
loadFeed();
</script>

</body>
</html>
